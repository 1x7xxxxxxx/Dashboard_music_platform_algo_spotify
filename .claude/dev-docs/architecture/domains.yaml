  perimetre: corpus de livres indexé (projet knowledge-rag hors dépôt), ingestion, recherche hybride, futur assistant in-app
  fichiers: []
  gardes: []
  mesures: []

pc-perf:
  nom: Poste de développement
  perimetre: WSL (mémoire, ext4), conteneurs locaux concurrents (n8n, knowledge-rag), VS Code Remote-WSL, alias de lancement
  fichiers: [tools/dev/pytest_workers.py]
