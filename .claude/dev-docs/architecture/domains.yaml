  gardes: [tests/test_an_action_is_on_the_roadmap_before_it_runs.py, tests/test_roadmap_index_is_honest.py, tests/test_roadmap_two_files.py, tests/test_every_dossier_action_is_in_the_roadmap.py]
  mesures: [make roadmap-discipline]

error-classes:
  nom: Classes d'erreur et registre applicatif
  perimetre: catalogue avec billet d'admission, signature vue rouge, familles, balayage ; app_error_log par empreinte
  fichiers: [.claude/dev-docs/error-classes.md, .claude/dev-docs/error-class-families.md, .claude/scripts/audit_runner.py, src/utils/error_registry.py]
  gardes: [tests/test_every_error_class_is_complete.py, tests/test_error_class_index_is_complete.py, tests/test_the_error_class_health_only_improves.py, tests/test_the_error_class_families_only_improve.py]
  mesures: [make error-health, make error-families, make error-inbox]

infra-observability:
  nom: Infrastructure et observabilité
  perimetre: VPS unique, conteneurs, Prometheus/Grafana, règles d'alerte, résumé quotidien en base, sauvegardes
  fichiers: [docker-compose.example.yml, deploy/prometheus/rules/streamlytics.yml, src/utils/metrics.py, src/utils/daily_ops_metrics.py, src/utils/ops_alerts.py, docs/adr/ADR-026-observability-is-adopted-to-watch-the-triggers.md]
  gardes: []
  mesures: [.claude/dev-docs/grafana-correspondence.md]

ml:
