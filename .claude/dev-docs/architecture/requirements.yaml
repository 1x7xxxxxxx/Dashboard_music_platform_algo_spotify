# R257 — le catalogue des exigences d'architecture de streaMLytics.
#
# Une entrée = UNE propriété durable que le système doit tenir (pas une retouche de page :
# celles-là sont des lignes de roadmap, voir notes-triage.yaml).
#   sources  : `notes: Lnnn` = revue/notes-architecture-2026-09-27.md (hors dépôt, dépôt public),
#              `kpi: fiche N` = revue/relecture-kpi.md, `adr:` / `doc:` = fichier du dépôt,
#              `theorie:` = livre de la bibliothèque, avec sa page (search_books).
#   statut   : conforme | partiel | absent | non-mesure — ce que l'on CROIT ; la preuve rejouée
#              par `make arch-benchmark` dit ce qui est VRAI (une preuve rouge sur un
#              « conforme » s'imprime RÉGRESSION).
#   preuve   : `pytest:` un nœud existant, ou `cmd:` une commande dont le code de sortie juge.
#   a_ecrire : quand aucune preuve n'existe — le test ciblé à écrire, sur quel site. Compté
#              comme TROU dans le benchmark, jamais omis.
#   mutation : l'édition, sur une ligne précise, qui doit faire rougir la preuve.
#   roadmap  : la ligne Rnnn qui porte le livrable, quand l'écart en demande un.

