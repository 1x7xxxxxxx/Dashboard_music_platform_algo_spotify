  statut: conforme
  preuve: {pytest: tests/test_every_metric_is_registered.py::test_every_read_gold_object_is_registered_and_no_entry_is_dead}
  mutation: "supprimer une entrée de REGISTRY dans tools/dev/metric_registry.py → l'objet or lu n'est plus déclaré"
