rag-knowledge: "rien du domaine n'est dans ce dépôt : le corpus, l'ingestion et la recherche hybride vivent dans le projet knowledge-rag (hors dépôt, ses propres tests), le domaine ne cite aucun fichier, et l'assistant in-app qui le consommerait n'existe pas encore — aucune propriété d'ici ne peut être prouvée par un test d'ici (R642)"
