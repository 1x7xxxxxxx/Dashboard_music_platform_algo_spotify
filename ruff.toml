# Ruff configuration for the music analytics SaaS project.
# Docs: https://docs.astral.sh/ruff/configuration/

target-version = "py311"
line-length = 110

[lint]
select = ["E", "F", "W"]
ignore = [
    # sys.path manipulation before imports — intentional in all entry points (app.py, DAGs, debug scripts)
    "E402",
    # One-liner routing / conditional style used throughout app.py and views
    "E701",
    "E702",
    # Bare except in DAG trigger fallbacks — intentional defensive pattern
    "E722",
    # Line too long — relaxed for SQL strings
    "E501",
    # Trailing whitespace — pre-existing across the entire codebase, not enforced
    "W291",
    "W293",
    # No newline at end of file — pre-existing
    "W292",
]

[lint.per-file-ignores]
# Test files: allow unused imports (fixtures, re-exports)
"tests/*" = ["F401"]
# ⚠️ Il y avait ici `"airflow/dags/*" = ["E402"]` et `"airflow/debug_dag/*" = ["E402"]`,
# retirés le 2026-09-18. `E402` est dans l'`ignore` GLOBAL ci-dessus (l. 11) depuis plus
# longtemps qu'eux : les deux entrées n'exemptaient donc RIEN. Mesuré — `ruff --isolated
# --select E402` sur ces deux dossiers sort des erreurs, la config projet en sort zéro,
# et retirer ces deux lignes ne change pas ce zéro.
#
# Ce qui les rendait dangereuses plutôt que seulement inutiles : le jour où `E402`
# sortirait de l'ignore global — la décision qu'on prendrait pour voir enfin les imports
# tardifs ailleurs — elles auraient ré-exempté tout `airflow/` en silence, sans qu'on
# l'ait choisi. Une exemption redondante n'est pas neutre : elle survit à la décision
# qui la rendait superflue.
