name: Mutation — weekly (parsers)

# R509 (study E1) — mutates the PURE parsers of `src/transformers/` and lists the mutants
# no test kills (tools/dev/mutate_parsers.py). Observational: survivors are a report, the
# job goes red only when a module's tests are red WITHOUT mutation (exit 2 — the run
# measured nothing). The report is uploaded as an artifact, never committed.
#
# Keep-or-retire criterion, fixed before the first run: ≥1 survivor that is a real test
# gap within the first month. Met on the trial run (2026-10-11, sacem_parser: 22 → 8).

# R650 (2026-10-26) — no cron: it runs on a push to main that changes the parsers it mutates
# (owner decision; 120 min a run ruled out every push).
on:
  push:
    branches: [main]
    paths:
      - src/transformers/**
      - tools/dev/mutate_parsers.py
      - .github/workflows/mutation-weekly.yml
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies from lockfile
        run: uv python install 3.11 && uv sync --frozen --extra dev && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Mutate the parsers
        run: .venv/bin/python tools/dev/mutate_parsers.py

      - name: Upload the survivors report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mutation-survivors
          path: .claude/dev-docs/mutation-survivors.md
          if-no-files-found: warn
