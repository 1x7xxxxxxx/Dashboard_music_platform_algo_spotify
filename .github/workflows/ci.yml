name: CI

# `push: ["**"]` alongside `pull_request` ran the ENTIRE workflow twice for the
# same commit: once for the push, once for the pull_request event. Measured
# 2026-08-17 over the last 20 runs — 15 distinct SHAs, 20 runs, 5 commits with
# both a `push` and a `pull_request` run. On a branch with an open PR that is
# every single commit, at ~2 min 40 each. Restricting `push` to the integration
# branches keeps the merge gate intact and lets the `pull_request` event be the
# only trigger while work is in review.
#
# Cost of this choice, stated: a branch with NO open PR no longer runs CI on
# push. Open the PR (draft is enough) and the gate is back — or run it by hand
# with `gh workflow run ci.yml --ref <branch>` via workflow_dispatch below.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

# Three pushes in a minute used to queue three full runs and let all three
# finish; only the last one can still be true. msdr's ci.yml has had this since
# the start — this repo did not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Pourquoi DEUX jobs indépendants, et quatre shards (R109, 2026-09-16) ────────
#
# Avant : un seul job `lint-and-test` de quinze étapes en file. Médiane **402 s**
# sur 177 exécutions par semaine — soit **≈18,5 h d'attente hebdomadaire**. Humble
# & Farley, *Continuous Delivery* p.155 et p.170 : un commit stage vise cinq
# minutes, dix au plafond, et **au-delà de cinq minutes on le scinde en suites
# parallèles**. Le seuil du livre était franchi.
#
# Deux gestes, et seulement deux :
#
# 1. les portes STATIQUES (manifeste, ruff, REX, signatures de classes d'erreur)
#    n'ont besoin ni de Postgres ni de la suite. Dans leur propre job, elles
#    rendent leur verdict en ~2 min au lieu de 7, et sortent du chemin critique ;
# 2. la suite se découpe en **quatre shards de durée égale** (`pytest-split`, sur
#    `.test_durations` versionné). Le dépôt est PUBLIC : les minutes Actions sont
#    gratuites, donc R109 achète du temps de mur avec des minutes qu'on ne paie pas.
#
# **AUCUN `needs:` entre les deux jobs, et c'est la partie non négociable.** Le
# chaîner recréerait exactement la panne de septembre : les gardes étaient l'étape
# 10 sur 15, un échec là sautait les cinq suivantes, et la suite n'a PAS tourné
# pendant **27 exécutions consécutives** (2026-09-04 → 06) sur une cause sans
# rapport — deux gardes lisaient le `.env` du poste. Vingt-sept commits sont partis
# sur main avec un seul signal rouge, toujours le même, et rien derrière.
# Garde : tests/test_a_red_gate_does_not_hide_the_suite.py
#
# Effet de bord GAGNÉ par les shards : chaque job a son propre conteneur Postgres
# et son propre disque. Deux tests d'un même fichier séparés par la découpe ne
# peuvent donc pas se courir après — ce qui est arrivé QUATRE fois en local le
# 2026-09-15 quand `--dist loadgroup` a remplacé `--dist loadfile`.

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  gates:
    name: Portes statiques
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # ── v4 → v10 le 2026-09-16, et le retard était INVISIBLE ──
      # `Install uv` coûtait **20 s** par job, soit le plus gros poste fixe des cinq
      # jobs une fois la suite shardée. Cause mesurée dans le log : le cache du
      # greffon avait un taux de succès de **0 %** — `Failed to restore: Cache service
      # responded with 400`. La v4 parle à l'API de cache que GitHub a retirée.
      #
      # Pourquoi personne ne l'a vu : `.github/dependabot.yml` ignore les MAJEURES
      # pour `github-actions`, et la raison est bonne (une majeure change le runner
      # sous la CI, et la CI est la seule chose qui parle avant un déploiement). Mais
      # `setup-uv` n'a publié que des majeures : la clause a donc gelé l'action à v4
      # pendant six majeures, sans qu'aucun signal n'existe. Une règle de prudence
      # sans ÉCHÉANCE ni VISIBILITÉ devient un gel silencieux.
      #
      # Le contrôle qui manquait tourne désormais la nuit, dans
      # `security-nightly.yml` : il dit, pour chaque action épinglée, de combien de
      # majeures elle est en retard. Non bloquant — c'est un signal, pas une porte.
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      # ── `Install system dependencies` retiré le 2026-09-15 ──
      # Il coûtait 10 s par run (médiane sur 15 runs) et n'achetait rien, mesuré dans
      # le log : `pkg-config is already the newest version` (no-op) et `build-essential`
      # est un méta-paquet de **4 928 octets / 17,4 kB sur disque** — gcc, g++, make,
      # dpkg-dev, libc6-dev sont déjà sur l'image `ubuntu-latest`. Les 10 s étaient
      # l'`apt-get update` (12 MB) et le `Reading database ... 201818 files` de dpkg.
      #
      # Il ne compilait rien : `uv sync` rapporte `Prepared 245 packages in 4.42s`,
      # sans une seule ligne `Building` — tout vient de wheels. Sa raison d'origine
      # (`libcairo2-dev` pour pycairo) a disparu avec la migration vers WeasyPrint ;
      # il ne restait qu'un « filet de sécurité » qui n'a jamais rien rattrapé.

      - name: Install dependencies from lockfile
        # --frozen: refuse to update uv.lock; CI must match what devs have locally.
        run: uv sync --frozen --extra dev

      - name: Manifest consistency (blocking)
        # Deterministic, sub-second, zero-network. Catches pin drift across
        # pyproject.toml / requirements.txt / uv.lock (error class
        # streamlit-pin-drift) before it ships a prod≠dev image.
        run: uv run python tools/dev/check_manifest_consistency.py

      - name: Lint (ruff) — full project (blocking)
        # Promoted from advisory to blocking on 2026-05-14 after baseline cleanup
        # (44 → 0 errors). Widened from `src/ tests/` to the whole tree on
        # 2026-08-21: the step was named "full project" and was not one. `airflow/`
        # — DAG code live-mounted into production containers — was outside it, and
        # carried 25 of the 40 findings that cleanup removed.
        run: uv run ruff check .

      - name: REX integrity + static error-class guards (blocking)
        env:
          # Le jeton fourni d'office par Actions. Il n'active qu'une chose : la
          # signature de `a-merged-branch-outlives-its-pull-request`, qui interroge
          # `gh api`. Sans lui elle faisait `|| echo true` et passait TOUJOURS — un
          # garde qui ne garde rien. Elle échoue désormais bruyamment si `gh` ne peut
          # pas répondre, ce qui exige que le jeton soit là.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # validate_rex.py enforces the rex: schema across every .claude/ tool;
        # audit_runner.py runs the error-class signatures catalogued in
        # .claude/dev-docs/error-classes.md (single source of truth).
        #
        # `--static` et non `--deterministic` (2026-09-15) : `--deterministic`
        # regroupait 261 signatures en UNE invocation pytest visant **219 des 362
        # fichiers de tests**, sans `-n`, donc en séquentiel, juste avant que la suite
        # relance la même chose. Le batch **expirait à son `timeout=1800`**.
        # `--static` garde exactement ce que la suite ne couvre pas : les 35 classes
        # déterministes dont la signature n'est PAS un pytest.
        run: |
          uv run python .claude/scripts/validate_rex.py --strict
          uv run python .claude/scripts/audit_runner.py --static
          uv run python .claude/scripts/audit_runner.py --prose
          uv run python .claude/scripts/check_config_refs.py
          uv run python .claude/scripts/check_ci_waste.py
          # `gold_coverage.py --check` et `error_class_families.py --check` NE SONT PLUS
          # appelés ici (2026-09-15). Ils tournaient TROIS fois par run : ici, via
          # `audit_runner --static` (la classe `a-generated-document-asserts-a-stale-state`
          # a exactement cette signature), et dans la suite. Le premier calcul coûte 11
          # à 20 s. Deux passages suffisent.

  # ════════════════════════════════════════════════════════════════════════════
  suite:
    name: Suite ${{ matrix.shard }}/4
    runs-on: ubuntu-latest

    strategy:
      # Un shard rouge ne doit pas annuler les trois autres : on veut le rapport
      # COMPLET, pas le premier échec. Même raison que `!cancelled()` ci-dessous.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    # Postgres service re-added 2026-06-13 — this time ACTUALLY PROVISIONED (init_db.sql
    # + migrations/*.sql, see the composite action), so the render-smoke and the ML DB
    # tests run in CI instead of skipping. The 2026-06-11 removal note was right that an
    # *unprovisioned* service added zero value; provisioning is the fix.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret — throwaway CI DB
          POSTGRES_DB: spotify_etl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spotify_etl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev

      - name: Provision Postgres (schema + migrations)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/provision-postgres

      - name: Mint a throwaway Fernet key for this run
        if: ${{ !cancelled() }}
        id: ci_fernet
        # Base64-urlsafe of 32 random bytes is exactly what Fernet.generate_key()
        # produces, without needing the package installed at this point in the job.
        #
        # GENERATED per run, not committed (R30, 2026-08-22). The literal that used
        # to sit here was a VALID Fernet key in a public file: nothing decrypts with
        # it today, but "CI only" is a property of how it is used, not of the key.
        run: |
          echo "key=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: ${{ !cancelled() }}
        env:
          # DATABASE_URL points the DB layer at the provisioned CI Postgres so the
          # render-smoke + ML DB tests run (they skip when it is absent).
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spotify_etl  # pragma: allowlist secret
          # Dummy Airflow creds: src/dashboard/app.py raises at IMPORT when
          # AIRFLOW_PASSWORD is unset (anti unauthenticated-DAG-trigger guard).
          AIRFLOW_USERNAME: ci
          AIRFLOW_PASSWORD: ci-not-a-real-secret  # pragma: allowlist secret
          # FERNET_KEY: src/dashboard/app.py raises at import if it's absent.
          FERNET_KEY: ${{ steps.ci_fernet.outputs.key }}
          # Le jeton fourni d'office par Actions — aucun secret à créer. Il n'active
          # qu'une chose : tests/test_the_monitor_itself_still_runs.py, qui vérifie
          # que `prod-health.yml` a réellement tourné.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `-n auto --dist loadgroup` : les MÊMES drapeaux que `make test`, et le
        # garde tests/test_local_and_ci_run_the_same_suite.py l'exige — « vert en
        # local » et « vert en CI » doivent être la même affirmation.
        #
        # `--splits 4 --group N` (R109, 2026-09-16) : la découpe lit `.test_durations`,
        # versionné, et rend quatre groupes de durée équivalente. SANS ce fichier la
        # découpe se fait sur le NOMBRE de tests, ce qui déséquilibre gravement ici —
        # un rendu `AppTest` coûte mille fois un garde AST.
        # Régénérer : `.venv/bin/python -m pytest tests/ --store-durations`.
        #
        # `-q` et non `-v` depuis le 2026-09-15. Mesuré sur le run 35003047396 :
        # `Run tests` produisait **13 238 lignes / 2 349 KB** de log, dont **6 445**
        # portant `PASSED`/`SKIPPED` — `-v` faisait **87 % du volume de log du job
        # entier**. `--tb=short` reste : un ÉCHEC dit toujours son node-id et sa trace.
        #
        # ⛔ LA COUVERTURE N'EST PLUS ICI, et ce n'est PAS le retrait qui avait été
        # refusé deux fois. Mesurée sur le runner, elle coûte +8 % (13 s) — ce n'est
        # pas son coût qui la déplace, c'est que **la couverture d'un quart de la
        # suite ne veut rien dire**, et que recombiner quatre rapports demanderait
        # quatre artefacts et un cinquième job sur le chemin critique. Elle vit
        # désormais dans `security-nightly.yml`, où la suite tourne ENTIÈRE, une fois
        # par nuit, hors du chemin critique — et où elle tourne en plus en ordre
        # aléatoire. Le dépôt n'a jamais eu de `--cov-fail-under` : rien ne gatait.
        run: >-
          uv run pytest tests/ -q --tb=short -n auto --dist loadgroup
          --splits 4 --group ${{ matrix.shard }}
