name: CI

# `push: ["**"]` alongside `pull_request` ran the ENTIRE workflow twice for the
# same commit: once for the push, once for the pull_request event. Measured
# 2026-08-17 over the last 20 runs — 15 distinct SHAs, 20 runs, 5 commits with
# both a `push` and a `pull_request` run. On a branch with an open PR that is
# every single commit, at ~2 min 40 each. Restricting `push` to the integration
# branches keeps the merge gate intact and lets the `pull_request` event be the
# only trigger while work is in review.
#
# Cost of this choice, stated: a branch with NO open PR no longer runs CI on
# push. Open the PR (draft is enough) and the gate is back — or run it by hand
# with `gh workflow run ci.yml --ref <branch>` via workflow_dispatch below.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

# Three pushes in a minute used to queue three full runs and let all three
# finish; only the last one can still be true. msdr's ci.yml has had this since
# the start — this repo did not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Postgres service re-added 2026-06-13 — this time ACTUALLY PROVISIONED (init_db.sql
    # + migrations/*.sql, see "Provision Postgres" step), so the 39-view render-smoke and
    # the ML DB tests run in CI instead of skipping. The 2026-06-11 removal note was right
    # that an *unprovisioned* service added zero value; provisioning is the fix. The
    # provision step fails loudly if the core schema is absent (no silent test SKIP).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret — throwaway CI DB
          POSTGRES_DB: spotify_etl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spotify_etl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install system dependencies (build tools for any wheel-less package)
        # Historical: libcairo2-dev was needed for pycairo (xhtml2pdf transitive).
        # Removed when PDF stack migrated to WeasyPrint (dashboard-only, not CI).
        # build-essential + pkg-config kept as a safety net for source builds.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config

      - name: Install dependencies from lockfile
        # --frozen: refuse to update uv.lock; CI must match what devs have locally.
        # --extra dev: include pytest, ruff, httpx, pytest-mock, pytest-cov.
        run: uv sync --frozen --extra dev

      - name: Manifest consistency (blocking)
        # Deterministic, sub-second, zero-network. Catches pin drift across
        # pyproject.toml / requirements.txt / uv.lock (error class
        # streamlit-pin-drift) before it ships a prod≠dev image.
        run: uv run python tools/dev/check_manifest_consistency.py

      - name: Lint (ruff) — full project (blocking)
        # Promoted from advisory to blocking on 2026-05-14 after baseline cleanup
        # (44 → 0 errors). Any regression now fails CI; revert to --exit-zero only
        # after explicit ADR.
        #
        # Widened from `src/ tests/` to the whole tree on 2026-08-21: the step was
        # named "full project" and was not one. `airflow/` — DAG code live-mounted
        # into production containers — was outside it, and carried 25 of the 40
        # findings that cleanup removed. `ruff.toml` carries the per-directory
        # exemptions (E402 for the mandatory sys.path insert in DAGs and debug
        # scripts, F401 in tests), so widening enforces the same rules everywhere
        # rather than inventing stricter ones.
        run: uv run ruff check .

      - name: REX integrity + deterministic error-class guards (blocking)
        # Deterministic, no-DB, sub-second. validate_rex.py enforces the rex: schema
        # across every .claude/ tool; audit_runner.py runs each kind:deterministic
        # error-class signature catalogued in .claude/dev-docs/error-classes.md
        # (single source of truth — no hand-synced Makefile drift). Heuristic
        # classes run in security-nightly.yml (non-blocking, manual triage).
        # `uv run` puts the venv on PATH so the signatures' python3/pytest resolve.
        run: |
          uv run python .claude/scripts/validate_rex.py --strict
          uv run python .claude/scripts/audit_runner.py --deterministic
          uv run python .claude/scripts/audit_runner.py --prose
          uv run python .claude/scripts/check_config_refs.py
          uv run python .claude/scripts/check_ci_waste.py

      - name: Error-class schema completeness (advisory)
        # `audit_runner.py --fields` fails when a class carries no root_cause or no
        # long_term_fix — a class nobody decided how to end. It is RED on 29/29
        # classes today (the catalogue predates the fields), so it reports and does
        # not block: turning it blocking now would close CI on legacy content and
        # the only way back open would be to lower the guard.
        #
        # Make it blocking once the count reaches 0 — and record the date here.
        # `/capitalise` writes both fields, so new classes arrive complete; this
        # step exists to keep the remaining backlog visible instead of silent.
        continue-on-error: true
        run: uv run python .claude/scripts/audit_runner.py --fields

      - name: Provision Postgres (schema + migrations)
        env:
          PGPASSWORD: postgres  # pragma: allowlist secret — throwaway CI DB
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client
          # The postgres image runs a temp init server then restarts, so poll a real
          # query (twice) before applying DDL rather than trusting the first hit.
          for i in $(seq 1 30); do
            if psql -h localhost -U postgres -d spotify_etl -tAc "SELECT 1" >/dev/null 2>&1; then
              sleep 2
              psql -h localhost -U postgres -d spotify_etl -tAc "SELECT 1" >/dev/null 2>&1 && break
            fi
            sleep 2
          done
          psql -h localhost -U postgres -d spotify_etl -v ON_ERROR_STOP=0 -f init_db.sql
          for f in $(ls migrations/*.sql | sort); do
            psql -h localhost -U postgres -d spotify_etl -v ON_ERROR_STOP=0 -f "$f"
          done
          # Fail loudly if provisioning did not produce the core schema — otherwise the
          # DB-backed tests would silently SKIP and we'd lose the coverage we just added.
          psql -h localhost -U postgres -d spotify_etl -v ON_ERROR_STOP=1 \
            -c "SELECT 1 FROM saas_artists LIMIT 1"
          # A SECOND tenant. A fresh canonical database holds exactly one
          # ("Artist Default"), and one tenant cannot expose a multi-tenant defect:
          # "collect for this tenant" and "collect for the whole fleet" return the
          # same rows, so every isolation bug reads as correct behaviour. Three were
          # found on 2026-08-21, none of them visible before a second tenant existed.
          # Identities are real PUBLIC ids (no ownership needed on these endpoints)
          # and deliberately different from tenant 1's, because a tenant borrowing
          # another's identity proves nothing. Guard: tests/test_suite_runs_against_two_tenants.py
          psql -h localhost -U postgres -d spotify_etl -v ON_ERROR_STOP=1 -c "
            INSERT INTO saas_artists (name, slug, tier, active, is_canary, spotify_artist_id)
            VALUES ('CI Canary', 'ci-canary', 'free', TRUE, TRUE, '4tZwfgrHOc3mvqYlEYSvVi')
            ON CONFLICT (slug) DO UPDATE SET spotify_artist_id = EXCLUDED.spotify_artist_id;
            INSERT INTO artist_credentials (artist_id, platform, extra_config)
            SELECT id, 'youtube', '{\"channel_id\": \"UC_x5XG1OV2P6uZZ5FSM9Ttw\"}'::jsonb
              FROM saas_artists WHERE slug = 'ci-canary'
            ON CONFLICT (artist_id, platform) DO NOTHING;"
          psql -h localhost -U postgres -d spotify_etl -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) >= 2 OR (SELECT false) FROM saas_artists WHERE active" \
            -tA | grep -qx t || { echo "::error::CI database has fewer than 2 tenants"; exit 1; }

      - name: Run tests
        env:
          # DATABASE_URL points the DB layer at the provisioned CI Postgres so the
          # 39-view render-smoke + ML DB tests run (they skip when it is absent).
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spotify_etl  # pragma: allowlist secret
          # Dummy Airflow creds: src/dashboard/app.py raises at IMPORT when
          # AIRFLOW_PASSWORD is unset (anti unauthenticated-DAG-trigger guard).
          AIRFLOW_USERNAME: ci
          AIRFLOW_PASSWORD: ci-not-a-real-secret  # pragma: allowlist secret
          # FERNET_KEY: src/dashboard/app.py raises at import if it's absent (credential-
          # decryption boot guard); a valid throwaway key keeps the import-time tests green.
          FERNET_KEY: Ggeni73PznXqdl3PyN7XlIyaM5K8fkVQFzddmVaLX58=  # pragma: allowlist secret
        # --cov-report=xml: for codecov-style downstream tooling.
        # --cov-report=term-missing: visible in CI logs (line numbers of uncovered code).
        # No --cov-fail-under: measure first, gate later.
        #
        # La couverture a failli sauter d'ici, sur l'idée qu'elle coûtait ~30 %.
        # Mesuré avant de trancher : 160,6 s sans, 174,0 s avec — **+8 %**, soit
        # 13 s. Pour 13 s on garde le seul rapport de couverture du dépôt. La
        # supposition était fausse et c'est la mesure qui a décidé.
        #
        # -n auto --dist loadfile : une seule chose change réellement le temps
        # ici. Mesuré contre un Postgres provisionné comme celui-ci —
        # 147,2 s → 101,1 s, 655 passés / 14 sautés à l'identique.
        # `loadfile` (et non le défaut `load`) parce que tests/test_live_pulse.py
        # écrit `active_sessions` : garder les tests d'un fichier sur un worker
        # empêche ce fichier d'entrer en collision avec lui-même.
        run: uv run pytest tests/ -v --tb=short -n auto --dist loadfile --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
          if-no-files-found: ignore
