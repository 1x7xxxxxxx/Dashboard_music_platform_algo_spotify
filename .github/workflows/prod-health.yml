name: Prod — Daily health check

# External synthetic monitoring of the LIVE production app, THROUGH Cloudflare.
# Catches edge/CF/cert/DNS/routing regressions that internal (on-box) checks miss
# — e.g. the 2026-06-14 Bot Fight Mode 403 on the Stripe webhook — plus prod-only
# schema drift on data endpoints (the /kpis & /youtube/videos 500 class) that CI,
# running on the canonical schema, structurally cannot see.
#
# Unlike security-nightly.yml (observational, non-blocking), this is a real gate:
# a failing probe makes the run RED. ⚠️ "GitHub emails the repo owner" was the whole
# alerting until 2026-09-25, and it reached nobody: on 2026-09-24 prod was down
# 11:45–20:51 UTC, this run was red at 11:45, and the outage was found that evening by
# accident. The last step now mails the owner directly (R166).
#
# Layer A (liveness) needs no secrets. Layer B (authenticated data-endpoint probe)
# logs in as a dedicated read-only service account; it self-skips if the two repo
# secrets are absent, so forks / unconfigured runs stay green.

on:
  schedule:
    # 06:17 et non 06:00. Mesuré le 2026-08-28 sur 38 exécutions : les écarts tenaient
    # 22,7–25,4 h, sauf UN à **34,6 h** — un créneau entier abandonné, puis un run à
    # 17:07. Le cron d'Actions est best-effort et les minutes rondes sont les plus
    # demandées, donc les premières lâchées sous charge. Décaler ne garantit rien ;
    # c'est `tests/test_the_monitor_itself_still_runs.py` qui garantit qu'on le SAURA.
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:
    inputs:
      force_red:
        description: "Fail on purpose, to prove the red verdict reaches the owner's inbox"
        type: boolean
        default: false

jobs:
  prod-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install probe deps
        # ── Cette liste est tenue À LA MAIN, et c'est sa faiblesse ──
        # `tests/conftest.py` est chargé pour TOUTE exécution de pytest, y compris
        # celle-ci qui ne vise qu'un fichier. Il apporte donc ses dépendances :
        #   * pandas    — importé au niveau module ;
        #   * pytest-xdist — il déclare le hook `pytest_configure_node`.
        #
        # `pytest-xdist` manquait, et le coût a été de NEUF JOURS. Le hook est arrivé
        # dans `conftest.py` le 2026-09-06 (20fd305) ; la sonde a réussi ce jour-là
        # pour la dernière fois et échoue tous les jours depuis le 2026-09-07 :
        #   PluginValidationError: unknown hook 'pytest_configure_node'
        #   no tests ran in 0.19s → exit code 3
        # La sonde de santé de la PRODUCTION n'a donc exécuté aucun test pendant
        # neuf jours, et rien ne l'a signalé : `tests/test_the_monitor_itself_still_runs.py`
        # vérifie que ce workflow A TOURNÉ, pas qu'il est VERT.
        #
        # Même défaut, même semaine, troisième endroit : `make test` était cassé par
        # la même cause (venv Windows sans xdist). Corriger une instance sans balayer
        # ses frères laisse la classe vivante — c'est la règle transverse 14.
        run: pip install pytest pytest-xdist requests pandas

      - name: Probe production endpoints (through Cloudflare)
        env:
          RUN_PROD_HEALTH: "1"
          HEALTHCHECK_USER: ${{ secrets.HEALTHCHECK_USER }}
          HEALTHCHECK_PASSWORD: ${{ secrets.HEALTHCHECK_PASSWORD }}
        run: pytest tests/test_prod_health.py -v

      - name: Refuse on purpose (workflow_dispatch force_red)
        if: ${{ inputs.force_red }}
        run: |
          echo "❌ force_red: failing on purpose to prove the red verdict is mailed"
          exit 1

      # A red that reaches nobody is not an alert (R166). This step runs from OUTSIDE
      # the server — the on-box `alert_monitor` mail could not report the 2026-09-24
      # outage, it was on the machine that was down.
      - name: Mail the red verdict to the owner
        if: ${{ failure() }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          PROD_HEALTH_MAIL_TO: ${{ secrets.PROD_HEALTH_MAIL_TO }}
        run: python tools/dev/mail_red_verdict.py
