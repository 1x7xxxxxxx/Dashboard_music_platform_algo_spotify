name: Security — Nightly audit

# Nightly security pass on main (observational — NOT a deploy gate):
#   - pip-audit:         Python deps vs PyPI Advisory DB
#   - error-class-audit: heuristic grep sweep (.claude/dev-docs/error-classes.md)
#   - gitleaks:          full git history secret scan
#
# By design every job is NON-BLOCKING: findings are surfaced in the run's
# Job Summary, the workflow stays green, and no nightly red email is sent.
# This matches the original intent ("observational, no deploy gate") which
# the previous hard-fail implementation contradicted.
#
# Pre-prod hardening backlog (re-enable blocking selectively before going live):
#   - pip-audit:  pin apache-airflow-core to the Docker image version, then
#                 restore `--strict` so real CVEs block.
#
# 2026-08-24 (R49) — l'audit lisait `requirements.txt`, que RIEN n'installe tel
# quel : ce fichier porte des PLANCHERS (`weasyprint>=62.0`, `cryptography>=42`),
# donc pip-audit résolvait des versions récentes et rendait un rapport propre,
# pendant que la CI installait `uv.lock` — qui épinglait pyjwt 2.12.1, starlette
# 1.0.0, python-multipart 0.0.28 : 127 avis sur 18 paquets. L'audit vérifiait un
# fichier de contraintes, pas un parc. Il lit désormais le lock RÉSOLU.
#   - gitleaks:   triage the ~27 historical findings (true secrets vs FPs like
#                 the 1x7xxxxxxx filter / config.example.yaml), add a
#                 .gitleaks.toml allowlist or rotate + baseline, then block.
#   - error-class-audit: stays heuristic/non-blocking (known FPs, e.g.
#                 cosmetic datetime.now() allowed by .claude/rules/python.md).

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # observational — never fail the workflow
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install uv + pip-audit
        run: |
          pip install pip-audit uv

      - name: Resolve the lock file into what actually gets installed
        # `uv export` rend le lock EXACT (`==`), pas les planchers de
        # `requirements.txt`. C'est ce que `uv sync --frozen` installe en CI, donc
        # c'est ce qui doit être audité.
        run: uv export --frozen --no-dev --no-hashes -o audited-requirements.txt

      - name: Audit dependencies (report to summary)
        run: |
          pip-audit -r audited-requirements.txt --desc on --format markdown \
            -o pip-audit.md || true
          {
            echo "## pip-audit (non-blocking)"
            echo
            cat pip-audit.md 2>/dev/null || echo "_pip-audit produced no report._"
          } >> "$GITHUB_STEP_SUMMARY"

  error-class-audit:
    # Heuristic sweep of the catalogue's automatable signatures
    # (.claude/dev-docs/error-classes.md). Known false positives (e.g.
    # cosmetic datetime.now()) — triage hits manually, never a gate.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Run error-class audit (report to summary)
        run: |
          {
            echo "## error-class audit (heuristic, non-blocking)"
            echo
            echo '```'
            make audit 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── De combien de majeures les actions sont-elles en retard ? (2026-09-16) ──
  #
  # `.github/dependabot.yml` ignore les MAJEURES pour `github-actions`, et la raison
  # est bonne : une majeure change le runner sous la CI. Le prix n'avait jamais été
  # mesuré — `astral-sh/setup-uv` est resté en **v4 pendant six majeures**, et la v4
  # parle à l'API de cache que GitHub a retirée : `Failed to restore: 400` sur chaque
  # exécution, **20 s perdues par job**, un taux de succès de cache de 0 %.
  #
  # Rien ne pouvait le signaler : une action qui ne publie QUE des majeures ne produit
  # aucune PR Dependabot, et le silence est indiscernable d'« à jour ». Ce job rend ce
  # silence lisible. Il RAPPORTE, il ne bloque pas — la montée reste un geste humain,
  # ce que la clause veut précisément protéger.
  action-drift:
    runs-on: ubuntu-latest
    continue-on-error: true   # observational — never fail the workflow
    steps:
      - uses: actions/checkout@v6

      - name: Combien de majeures de retard (report to summary)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Retard des actions GitHub (non bloquant)"
            echo
            python3 tools/dev/check_action_drift.py
          } | tee -a "$GITHUB_STEP_SUMMARY"

  gitleaks:
    runs-on: ubuntu-latest
    continue-on-error: true   # historical leaks triaged pre-prod, not here
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # gitleaks needs full history to scan all commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action writes its own Job Summary + SARIF artifact.

  # ── La suite ENTIÈRE, en ordre aléatoire, avec la couverture (2026-09-16) ──────
  #
  # Deux choses vivent ici et nulle part ailleurs, et chacune a sa raison de ne pas
  # être sur le chemin critique d'une PR.
  #
  # **L'ordre aléatoire.** `pytest-randomly` est l'instrument qui a trouvé, le
  # 2026-09-15, que le cliquet des allers-retours SQL mesurait son VOISINAGE : son
  # script vidait les caches en les NOMMANT, et `_cached_plan_row` n'était dans
  # aucune liste. Le plafond de 13 ne tenait qu'en ordre de fichier. Il est
  # désactivé par défaut (`addopts = "-p no:randomly"`) pour deux raisons mesurées :
  # `pytest-split` répartit sur des durées indexées par node-id et suppose un ordre
  # stable, et une suite qui change d'ordre à chaque exécution ne peut plus servir de
  # référence chiffrée. Mais un détecteur qu'il faut penser à lancer à la main n'est
  # pas un détecteur : il tourne donc ici, chaque nuit, non bloquant.
  #
  # **La couverture.** Elle était sur `Run tests` jusqu'à R109. Ce n'est pas son coût
  # qui l'a déplacée — mesurée SUR LE RUNNER elle vaut +8 % (13 s), pas les ~30 %
  # supposés deux fois — c'est que la couverture d'un quart de la suite ne veut rien
  # dire, et que recombiner quatre rapports demanderait quatre artefacts et un
  # cinquième job. Ici la suite tourne entière, une fois, et le rapport est complet.
  # Le dépôt n'a jamais eu de `--cov-fail-under` : rien ne gatait, rien ne gate.
  full-suite-random-order:
    runs-on: ubuntu-latest
    continue-on-error: true   # observational — never fail the workflow

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret — throwaway CI DB
          POSTGRES_DB: spotify_etl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spotify_etl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          # EXPLICITE, parce que la v10 a changé le défaut sous nos pieds : elle clé
          # le cache sur `**/*requirements*.txt` là où la v4 utilisait `**/uv.lock`.
          # Or `uv sync --frozen` n'installe QUE ce que dit `uv.lock` — un cache clé
          # sur `requirements.txt` ne s'invalide donc pas quand les dépendances
          # réellement installées changent, et s'invalide quand elles ne changent pas.
          # Une montée de majeure qui déplace un défaut est exactement ce que la
          # clause « majeures manuelles » de dependabot.yml veut faire relire.
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev

      - name: Provision Postgres (schema + migrations)
        uses: ./.github/actions/provision-postgres

      - name: Mint a throwaway Fernet key for this run
        id: nightly_fernet
        run: |
          echo "key=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_OUTPUT"

      - name: Full suite, random order, with coverage (report to summary)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spotify_etl  # pragma: allowlist secret
          AIRFLOW_USERNAME: ci
          AIRFLOW_PASSWORD: ci-not-a-real-secret  # pragma: allowlist secret
          FERNET_KEY: ${{ steps.nightly_fernet.outputs.key }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ── `tee` et pas seulement le résumé, et AUCUN `|| true` (2026-09-16) ──
        # Première rédaction : tout partait dans `$GITHUB_STEP_SUMMARY` et la commande
        # se terminait par `|| true`. Deux conséquences, mesurées sur le premier run
        # réel : le LOG du job ne contenait pas le verdict de pytest (seulement le
        # bruit de Postgres sur stderr), et l'étape ne pouvait pas échouer. Le job
        # porte `continue-on-error` — une suite rouge la nuit aurait donc été
        # strictement invisible, ce qui est le défaut que ce dépôt combat partout
        # ailleurs.
        #
        # Désormais : `tee` met le verdict dans le log ET dans le résumé, et le code
        # de retour de pytest remonte (`set -o pipefail`). Le job apparaîtra alors en
        # `failure` dans `gh run list --json jobs` pendant que le workflow reste vert
        # — exactement le comportement de `gitleaks` juste au-dessus, qui est le
        # précédent établi ici pour « observationnel mais VISIBLE ».
        run: |
          set -o pipefail
          {
            echo "## Suite complète — ordre aléatoire + couverture (non bloquant)"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          uv run pytest tests/ -q --tb=short -n auto --dist loadgroup \
            -p randomly --cov=src --cov-report=term-missing 2>&1 \
            | tail -60 | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc
