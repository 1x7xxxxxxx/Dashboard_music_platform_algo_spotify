# Pre-commit hook configuration.
#
# Install once:  pip install pre-commit && pre-commit install
# (or simply :   make hooks-install)
#
# Run on demand: pre-commit run --all-files
# Bypass once  : git commit --no-verify
#
# The CI workflow at .github/workflows/ci.yml runs `ruff check` as a blocking
# step. These hooks catch the same problems (and more) locally before push.

# R196 (2026-09-26): `pre-commit install` also installs the commit-msg hook, and every
# existing hook stays on the pre-commit stage only.
# R444 (2026-10-07): and the pre-push hook — the push carries the tree the suite saw green.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # ── R196: no product-code commit without an OPEN roadmap row written BEFORE it ──
  # Owner, 2026-09-26: « se garantir d'inscrire une action en roadmap avant de l'exécuter ».
  # The pre-edit half is the Claude Code PreToolUse hook require_roadmap_entry.py; the CI
  # job `roadmap` re-judges pushed commits (a `--no-verify` does not pass there).
  - repo: local
    hooks:
      - id: roadmap-before-code
        name: roadmap — a product-code commit cites an open Rnnn written before it
        language: system
        entry: python3 tools/dev/require_roadmap_id.py
        stages: [commit-msg]
        always_run: true

      # R444 — main went red twice on 2026-10-07 (R438, R443) on guards `make test-changed`
      # runs; both commits were pushed after targeted tests only. No suite here (~0.3 s):
      # the hook compares the pushed tree with the one the last green run stamped.
      - id: pre-push-tested-tree
        name: push — the pushed tree is the tree `make test-changed` saw green (R444)
        language: system
        entry: python3 tools/dev/pre_push_gate.py
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      # R250 — a new test committed without its duration turned main red three times on
      # 2026-09-27 (pytest-split gives it an AVERAGE and the CI gate refuses it). ~8 s of
      # collection, and only when a test file is staged.
      # R345 (2026-10-04): the `gold-coverage-fresh` hook (R320) is gone with the versioned
      # gold map — the document is generated on demand, its ratchets compute on the tree.
      - id: test-durations-known
        name: tests — every staged test has a recorded duration (make test-durations-missing)
        language: system
        entry: .venv/bin/python tools/dev/check_durations_are_collectable.py
        args: [--fix-once]          # R319: measures the missing ones, then refuses ONCE
        # `.test_durations` too: a staged copy carrying durations of UNTRACKED files is
        # refused — CI, with no exclusion, would read them as phantoms (2026-10-04).
        files: ^(tests/test_[^/]*\.py|\.test_durations)$
        pass_filenames: true        # staged names = "runs as the commit hook"
      - id: governance-readers
        name: pilotage — the tests that NAME a staged roadmap/architecture file run first (R361)
        language: system
        entry: .venv/bin/python tools/dev/run_readers.py
        # 9 recurrence tickets on 2026-10-04 were all main-CI reds on these guards; the
        # readers of checklist.md run in ~31 s serial, the full selection in 274 s.
        files: ^\.claude/dev-docs/(roadmap/(checklist|archive)\.md|architecture/[^/]*\.yaml)$
        pass_filenames: true

  # ── Ruff: Python lint (matches CI baseline 2026-05-14 = 0 errors) ─────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5      # keep in sync with pyproject.toml dev extras
    hooks:
      - id: ruff
        args: [--fix]
      # ruff-format is intentionally NOT enabled: the codebase predates ruff
      # format and contains intentional style choices (alignment, line breaks).
      # To enable, do a one-shot `ruff format src/ tests/` commit first, then
      # add: - id: ruff-format here.

  # ── Manifest pin parity (error class: streamlit-pin-drift) ────────────
  # Local hook (no network). Runs only when a manifest changes. Same script
  # the ci.yml blocking step runs. See .claude/dev-docs/error-classes.md.
  - repo: local
    hooks:
      - id: manifest-consistency
        name: manifest consistency (pyproject/requirements/uv.lock)
        language: system
        entry: python3 tools/dev/check_manifest_consistency.py
        files: '^(pyproject\.toml|requirements\.txt|uv\.lock)$'
        pass_filenames: false

      # R186 (2026-09-26): the same check as the Claude Code Bash hook, for a `git commit`
      # typed in a terminal — which the hook never saw. A new class (or récidive) must be
      # bound to a sibling-sweeper / engineering-loop call that mentions it.
      - id: catalogue-sweep
        name: error-class catalogue — a new class is bound to its sweep
        language: system
        entry: python3 .claude/hooks/require_sweep_before_catalogue.py --git
        files: '^\.claude/dev-docs/error-classes\.md$'
        pass_filenames: false

  # ── REX schema (error class: ci-gate-with-no-local-counterpart) ───────
  # `validate_rex.py --strict` is a BLOCKING ci.yml step and had no local
  # counterpart: two `rex[0].issue` written past the 350-char cap on
  # 2026-09-04 (commit 8176e97) passed pre-commit and reddened eight
  # consecutive CI runs on main. Same script the CI step runs, 0.6 s, no
  # network. Fires only when a .claude/ tool file changes — those are the
  # only files it reads (_SCAN_DIRS in validate_rex.py).
  - repo: local
    hooks:
      - id: validate-rex
        name: REX schema (.claude/ tools)
        language: system
        entry: python3 .claude/scripts/validate_rex.py --strict
        files: '^\.claude/.*\.(md|py)$'
        pass_filenames: false

  # ── Generic hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # markdown uses 2-space line breaks; tests/fixtures hold byte-exact snapshots
        exclude: (\.md$|^tests/fixtures/)
      - id: end-of-file-fixer
        # `.test_durations` est ecrit par `pytest-split`, qui ne pose pas de saut de ligne
        # final. Le hook le corrigeait a CHAQUE commit touchant les durees — six fois dans
        # la seule seance du 2026-09-18, chacune coutant un aller-retour `git add`. Le
        # fichier est genere et jamais lu par un humain ; normaliser sa derniere ligne
        # n'achete rien et se paie a chaque mesure.
        exclude: (^tests/fixtures/|^\.test_durations$)   # snapshots byte-exacts ; JSON genere
      - id: check-yaml
        # `deploy/docker-compose.replica.yml` porte `ports: !override`, un tag que
        # DOCKER COMPOSE comprend (>= 2.24) et que PyYAML refuse : « could not
        # determine a constructor for the tag '!override' ». Le tag n'est pas
        # decoratif — sans lui `extends` FUSIONNE les listes et la replique herite le
        # port de l'originale, donc refuse de demarrer.
        #
        # Exclu ici, mais PAS non garde : `tests/test_a_deploy_covers_every_service_it_starts.py`
        # le lit avec un loader qui tolere le tag et verifie que la replique publie
        # 8511 et SEULEMENT lui. Une exemption qui ne deplace pas la verification
        # ailleurs est un trou.
        exclude: ^deploy/docker-compose\.replica\.yml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]   # 1 MB — protects against CSV/PDF mishaps
      - id: detect-private-key

  # ── Secret leakage detection ──────────────────────────────────────────
  # Catches obvious AWS/GCP/Stripe keys committed by mistake. The .secrets.baseline
  # file (auto-generated on first run) marks pre-existing acknowledged matches.
  # gitleaks knows provider FORMATS (GCP, Stripe…) where detect-secrets judges entropy.
  # A missing binary fails the commit and names `make hooks-install` (2026-09-25, R177).
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: tools/dev/gitleaks_staged.sh
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
            .*\.lock|
            uv\.lock|
            graphify-out/.*|
            tests/fixtures/.*
          )$
