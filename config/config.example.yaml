# Configuration Example - Copiez ce fichier en config.yaml et remplissez vos credentials

database:
  host: localhost
  port: 5433
  database: spotify_etl
  user: postgres
  password: VOTRE_PASSWORD

meta_ads:
  access_token: "VOTRE_META_ACCESS_TOKEN"
  ad_account_id: "act_XXXXXXXXX"

spotify:
  client_id: "VOTRE_SPOTIFY_CLIENT_ID"
  client_secret: "VOTRE_SPOTIFY_CLIENT_SECRET"
  redirect_uri: "http://localhost:8888/callback"

# --- Brick 4: Fernet encryption key (for artist_credentials) ---
# Générer : python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
fernet_key: "VOTRE_FERNET_KEY_BASE64_44_CHARS"

# --- Auth (Brick 2) ---
# Désactivez cette section pour le mode développement sans login.
# Générer un hash : python -c "import streamlit_authenticator as stauth; print(stauth.Hasher(['motdepasse']).generate()[0])"
auth:
  cookie:
    name: music_dashboard
    key: CHANGEZ_MOI_CLE_SECRETE_32_CHARS  # doit faire >= 32 caractères
    expiry_days: 30
  credentials:
    usernames:
      admin:
        name: Admin
        email: admin@example.com
        password: $2b$12$HASH_DU_MOT_DE_PASSE_ADMIN  # bcrypt hash
        role: admin
        artist_id: null  # null = voit toutes les données
      artist1:
        name: Artiste 1
        email: artist1@example.com
        password: $2b$12$HASH_DU_MOT_DE_PASSE_ARTIST1  # bcrypt hash
        role: artist
        artist_id: 1

# ⚠️ Section ABSENTE de ce gabarit jusqu'au 2026-09-18, alors que
# `build_airflow_trigger()` la lit et que le `config.yaml` de la machine de
# développement la portait déjà. Un repli vivant mais non documenté se lit comme un
# repli mort : l'audit du jour l'a d'abord classé « clé morte, à supprimer ».
#
# Ordre de résolution, du plus prioritaire au moins : `AIRFLOW_USERNAME` /
# `AIRFLOW_PASSWORD` (le nom CÔTÉ APPLICATION, celui que compose fabrique pour le
# service dashboard), puis `AIRFLOW_ADMIN_USERNAME` / `AIRFLOW_ADMIN_PASSWORD` (le nom
# de PROVISIONNEMENT, donné à `airflow-init` pour CRÉER le compte), puis cette
# section. S'il ne reste rien, on LÈVE — il n'y a plus de défaut littéral.
airflow:
  base_url: "http://localhost:8080"
  username: "VOTRE_UTILISATEUR_AIRFLOW"
  password: "VOTRE_MOT_DE_PASSE_AIRFLOW"  # pragma: allowlist secret

smtp:
  # Le nom d'affichage de l'expéditeur. MESURÉ le 2026-08-23 : cette valeur-ci était
  # `Music Cross Platform Dashboard & Trigger Spotify`, et c'est elle — pas un réglage
  # du compte Brevo, comme la roadmap le supposait — qui s'affichait dans la boîte des
  # utilisateurs. Le code lit `SMTP_FROM_NAME`, PUIS cette clé, PUIS son défaut
  # `streaMLytics` : un repli intermédiaire renseigné n'atteint jamais le défaut.
  from_name: "streaMLytics"
  # L'adresse d'expédition, DISTINCTE du login SMTP. Chez un relais (Brevo, Mailgun…)
  # le login est un compte technique et le `From` doit porter l'adresse du domaine
  # authentifié, sinon le relais y substitue son propre expéditeur par défaut.
  from_email: "noreply@example.com"
  host: "smtp.example.com"
  port: 587
  user: ""
  password: ""
