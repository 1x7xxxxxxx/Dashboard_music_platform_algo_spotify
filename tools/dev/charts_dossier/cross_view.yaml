# R569 — what each figure of the cross view draws, as (dimension · metric) pairs.
# Read by tools/dev/charts_dossier/cross_view.py; the walk from the five sections makes this
# list exhaustive (a new figure fails until declared) and never stale (a removed one fails
# until its entry goes). A pair named twice is a duplicate unless one site renders
# `instead_of` the other. Owner, 2026-10-15: « une donnée = un graphique ».

