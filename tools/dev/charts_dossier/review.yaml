# ── Grafana — robustesse de l'app (les 4 signaux d'or, SRE p. 86) ────────────
grafana:1:
  q: "LATENCE — l'app répond-elle vite (cadre vs corps de page) ?"
  role: archi
  d: 1
  c: 1
  p: 5
  v: corriger
  owner_v: corriger
  owner: "Vérifie tous les chiffres faux ; une méthode pour avoir les bonnes valeurs dans tous les dashboards, avec des error classes — l'archi bronze/argent/or devait l'empêcher (R205)."
  cause: grafana-latence-aveugle
  note: "DEUX points mesurés en 7 jours alors que le trafic existe — le signal d'or « latence » est aveugle. Vérifier que l'histogramme de rendu est bien observé en prod (couture metrics_seam)."
grafana:2:
  q: "SATURATION — des rendus s'empilent-ils ?"
  role: archi
  d: 3
  c: 4
  p: 4
  v: garder
  note: "Toujours 0 : juste pour ce trafic ; utile le jour où il monte."
grafana:3:
  q: "SATURATION — le pool Postgres tient-il, ou retombe-t-on en connexions directes ?"
  role: archi
  d: 3
  c: 2
  p: 5
  v: corriger
  owner_v: corriger
  owner: "Vérifie tous les chiffres faux ; une méthode pour avoir les bonnes valeurs dans tous les dashboards, avec des error classes — l'archi bronze/argent/or devait l'empêcher (R205)."
  cause: pool-replis
  note: "« REPLIS directs » grimpe jusqu'à ~8 000 en dents de scie (remis à zéro à chaque déploiement) — soit le pool n'est presque jamais utilisé en prod, soit la jauge compte un cumul. La règle ConnectionPoolExhausted (direct_fallback > 0) devrait alors être en feu. À vérifier en PREMIER côté archi."
grafana:4:
  q: "ERREURS — quelles pages lèvent ?"
  role: archi
  d: 3
  c: 4
  p: 5
  v: garder
  note: "Vide sur 7 jours = zéro erreur (et le panneau 11 prouve que la lecture fonctionne). Un « 0 » écrit vaudrait mieux qu'un graphique vide."
grafana:5:
  q: "SATURATION — CPU, RAM, disque de la machine"
  role: archi
  d: 4
  c: 5
  p: 5
  v: garder
  note: "CPU ~9 %, RAM ~40 %, disque 55 → 60 % en une semaine : la pente du disque est à surveiller."
grafana:6:
  q: "TRAFIC — requêtes au proxy"
  role: archi
  d: 3
  c: 5
  p: 4
  v: garder
  note: "< 1 req/s : le signal existe et il est juste."
grafana:7:
  q: "LATENCE — quelle page est lente ?"
  role: archi
  d: 1
  c: 1
  p: 5
  v: corriger
  owner_v: corriger
  owner: "Vérifie tous les chiffres faux ; une méthode pour avoir les bonnes valeurs dans tous les dashboards, avec des error classes — l'archi bronze/argent/or devait l'empêcher (R205)."
  cause: grafana-latence-aveugle
  note: "UN seul point en 7 jours — même cécité que le panneau 1."
grafana:8:
  q: "SATURATION — mémoire des processus"
  role: archi
  d: 4
  c: 5
  p: 4
  v: garder
  note: "Le dashboard a monté à ~450 Mo le 22/09 puis est redescendu — lisible."
grafana:9:
  q: "SATURATION — CPU des processus"
  role: archi
  d: 3
  c: 5
  p: 3
  v: garder
  note: "< 2 % ; bruit de fond."
grafana:10:
  q: "ERREURS — défauts ouverts, persistants entre déploiements"
  role: archi
  d: 3
  c: 4
  p: 5
  v: garder
  note: "Vide = 0 défaut ouvert (confirmé par le panneau 11)."
grafana:11:
  q: "Le compteur de défauts sait-il lire ?"
  role: archi
  d: 4
  c: 5
  p: 4
  v: garder
  note: "Lecture réussie = 1 en continu ; âge de la dernière lecture < 45 s. Le bon garde-fou contre un « 0 » aveugle."
grafana:12:
  q: "TRAFIC — combien d'artistes et de sessions ?"
  role: business
  d: 3
  c: 4
  p: 4
  v: garder
  note: "Trois pics à 1 artiste en 7 jours — l'usage réel, et il est faible (ADR-028 : l'activation est le blocage)."
grafana:13:
  q: "TRAFIC — quelles routes d'API, quels statuts ?"
  role: archi
  d: 2
  c: 5
  p: 3
  v: garder
  note: "Surtout /metrics et /health (la supervision elle-même) ; le trafic utile est invisible dessous — filtrer ces deux routes."
grafana:14:
  q: "LATENCE — l'API répond-elle vite ?"
  role: archi
  d: 3
  c: 5
  p: 4
  v: garder
  note: "p95 < 80 ms ; idem, dominé par /health."
grafana:16:
  q: "ÉCHELLE — la base grossit-elle, et quelle table approche du million ?"
  role: archi
  d: 3
  c: 4
  p: 3
  v: garder
  note: "R265. Noté sur sa REQUÊTE, pas sur son rendu : les deux séries n'existent en prod qu'après le déploiement de la jauge. À regarder dans Grafana au premier jour ; s4a_song_timeline mène (34 078 lignes en local)."
grafana:17:
  q: "DISQUE — sera-t-il plein, et quand ?"
  role: archi
  d: 4
  c: 4
  p: 5
  v: garder
  note: "R300, regardé sur le Prometheus de prod le 2026-09-28 : 68 → 54 Go libres en 7 jours, par marches (rebuild de l'image Airflow, sauvegardes) ; la pente projette ~33 Go dans 30 jours. Le panneau 5 ne disait que le pourcentage du jour."
grafana:18:
  q: "MÉMOIRE — le noyau a-t-il tué un processus faute de RAM ?"
  role: archi
  d: 4
  c: 4
  p: 4
  v: garder
  note: "R300 : 0 processus tué sur 7 jours, exportateur lu en continu (la ligne à 1 empêche de lire un 0 aveugle). Pas de swap sur ce VPS."
grafana:19:
  q: "DISPONIBILITÉ — le VPS a-t-il redémarré ?"
  role: archi
  d: 4
  c: 4
  p: 3
  v: garder
  note: "R300 : 82 → 89 jours de fonctionnement, aucun redémarrage sur la semaine. La coupure du 2026-09-24 (impayé) n'a pas redémarré le noyau."
grafana:20:
  q: "SUPERVISION — chaque service surveillé répond-il ?"
  role: archi
  d: 4
  c: 3
  p: 5
  v: garder
  note: "R300 : les 5 cibles (caddy, prometheus, api, dashboard, node) à 1 toute la semaine — les lignes se superposent, c'est le cas sain. Premier panneau à lire quand un autre est vide."
grafana:21:
  q: "RÉSEAU — la bande passante sature-t-elle ?"
  role: archi
  d: 3
  c: 4
  p: 3
  v: garder
  note: "R300 : ~730 octets/s émis, ~40 reçus, plats — très loin de toute saturation."
grafana:22:
  q: "CHARGE — le processeur fait-il attendre du travail ?"
  role: archi
  d: 4
  c: 4
  p: 4
  v: garder
  note: "R300 : charge par vCPU entre 0,07 et 0,28 (1 = saturé) — de la marge ; les pics coïncident avec les rebuilds."
grafana:15:
  q: "ERREURS — volume de journaux par niveau"
  role: archi
  d: 2
  c: 4
  p: 2
  v: fusionner
  owner_v: fusionner
  owner: "Fusionne tout ce que tu proposes ; et une méthode pour ne plus créer de doublons (R207)."
  cause: doublon
  note: "WARNING ≈ 0 et un « plancher » constant tracé deux fois — rien à décider ; fusionner dans le panneau des erreurs."

src/dashboard/utils/campaign_pair.py::render_day0#1:
  mq: M4
  q: "Deux campagnes, au même âge, laquelle dépense, clique et coûte le mieux ?"
  decision: "Comparer deux campagnes à âge égal (J0 = premier euro), pour décider laquelle refaire."
  decision_en: "Compare two campaigns at equal age (day 0 = first euro), to decide which one to run again."
  role: meta
  d: 4
  c: 4
  p: 4
  v: garder
  note: "R350, rendu le 2026-10-04 sur la base locale (artiste 1, les campagnes 1ʳᵉ et 3ᵉ par dépense). Cumuls depuis J0 + CPC = dépense cumulée ÷ clics cumulés ; on lit d'un coup d'œil que la seconde coûte ~0,18 € le clic contre ~0,13 €. Étiquettes du 1ᵉʳ cadre rognées (marge l=10) : corrigé avant la revue."
src/dashboard/utils/campaign_pair.py::render_share_pair#1:
  mq: M7
  q: "Les deux campagnes ont-elles touché les mêmes pays, plateformes et âges ?"
  decision: "Voir si deux campagnes ont touché le même public, en part de leur propre total, pour choisir quel ciblage garder."
  decision_en: "See whether two campaigns reached the same audience, as a share of their own total, to choose which targeting to keep."
  role: meta
  d: 3
  c: 3
  p: 4
  v: garder
  note: "R350, rendu le 2026-10-04 sur la base locale (artiste 1, campagnes 1ʳᵉ et 3ᵉ par dépense, pays + âge réels). Parts de chaque total, même axe en % : on lit que l'une a payé le Mexique et la Colombie, l'autre la France et l'Allemagne. Deux défauts mineurs : les tranches d'âge sont triées par part et non dans leur ordre ; dans chaque groupe la 1ʳᵉ campagne est dessinée SOUS la seconde alors que la légende la nomme en premier."
