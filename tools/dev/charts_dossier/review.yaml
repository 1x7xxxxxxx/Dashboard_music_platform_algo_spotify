grafana:16:
  q: "ÉCHELLE — la base grossit-elle, et quelle table approche du million ?"
  role: archi
  d: 3
  c: 4
  p: 3
  v: garder
  note: "R265. Noté sur sa REQUÊTE, pas sur son rendu : les deux séries n'existent en prod qu'après le déploiement de la jauge. À regarder dans Grafana au premier jour ; s4a_song_timeline mène (34 078 lignes en local)."
grafana:17:
  q: "DISQUE — sera-t-il plein, et quand ?"
  role: archi
  d: 4
  c: 4
  p: 5
  v: garder
  note: "R300, regardé sur le Prometheus de prod le 2026-09-28 : 68 → 54 Go libres en 7 jours, par marches (rebuild de l'image Airflow, sauvegardes) ; la pente projette ~33 Go dans 30 jours. Le panneau 5 ne disait que le pourcentage du jour."
grafana:18:
  q: "MÉMOIRE — le noyau a-t-il tué un processus faute de RAM ?"
  role: archi
  d: 4
  c: 4
  p: 4
  v: garder
  note: "R300 : 0 processus tué sur 7 jours, exportateur lu en continu (la ligne à 1 empêche de lire un 0 aveugle). Pas de swap sur ce VPS."
grafana:19:
  q: "DISPONIBILITÉ — le VPS a-t-il redémarré ?"
  role: archi
  d: 4
  c: 4
  p: 3
  v: garder
  note: "R300 : 82 → 89 jours de fonctionnement, aucun redémarrage sur la semaine. La coupure du 2026-09-24 (impayé) n'a pas redémarré le noyau."
grafana:20:
  q: "SUPERVISION — chaque service surveillé répond-il ?"
  role: archi
  d: 4
  c: 3
  p: 5
  v: garder
  note: "R300 : les 5 cibles (caddy, prometheus, api, dashboard, node) à 1 toute la semaine — les lignes se superposent, c'est le cas sain. Premier panneau à lire quand un autre est vide."
grafana:21:
  q: "RÉSEAU — la bande passante sature-t-elle ?"
  role: archi
  d: 3
  c: 4
  p: 3
  v: garder
  note: "R300 : ~730 octets/s émis, ~40 reçus, plats — très loin de toute saturation."
grafana:22:
  q: "CHARGE — le processeur fait-il attendre du travail ?"
  role: archi
  d: 4
  c: 4
  p: 4
  v: garder
  note: "R300 : charge par vCPU entre 0,07 et 0,28 (1 = saturé) — de la marge ; les pics coïncident avec les rebuilds."
grafana:15:
  q: "ERREURS — volume de journaux par niveau"
  role: archi
  d: 2
  c: 4
  p: 2
  v: fusionner
  owner_v: fusionner
  owner: "Fusionne tout ce que tu proposes ; et une méthode pour ne plus créer de doublons (R207)."
  cause: doublon
  note: "WARNING ≈ 0 et un « plancher » constant tracé deux fois — rien à décider ; fusionner dans le panneau des erreurs."

src/dashboard/utils/campaign_compare.py::_render_track_funnel#1:
  mq: M5
  q: "Quel titre transforme le mieux, de la pub au clic vers les plateformes ?"
  decision: "Choisir le titre qui transforme le mieux de la pub au clic, pour y mettre le budget."
  decision_en: "Choose the track that converts best from ad to click, to put the budget there."
  role: meta
  d: 4
  c: 4
  p: 5
  v: garder
  note: "Nouveau (R246, fiche 40) : jusqu'à 5 titres comparés, deux chaînes côte à côte — côté pub (impressions → clics) et côté smart link (visites → clics plateformes) —, échelle log. Une étape qui s'élargit ou n'est pas mesurée est retirée et nommée ; les écoutes gagnées sont écrites à part."
src/dashboard/views/trigger_algo/_tab_algo_streams.py::_render_estimates#1:
  q: "Si un algorithme se déclenche, combien de streams rapporte-t-il d'habitude, au 1er mois, vers 6 mois, vers 1 an ?"
  decision: "Estimer ce qu'un déclenchement d'algorithme rapporte, pour chiffrer le budget qui vaut la peine."
  decision_en: "Estimate what an algorithm trigger brings, to size the budget worth spending."
  role: prediction
  d: 4
  c: 3
  p: 5
  v: garder
  note: "Nouveau (R247, fiche 43) : médiane et P25–P75 des streams algorithmiques sur 28 jours, chez les titres DÉCLENCHÉS du jeu d'entraînement (seuils du modèle : DW>137, RR>130, Radio>639), à trois âges ; un panneau par algorithme, chacun à son échelle ; une case de moins de 10 titres est écrite « pas assez de titres » (1 an : refusé partout). Une estimation, pas une prévision pour le titre."
