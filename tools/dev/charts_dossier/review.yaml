# R203 — la revue de chaque graphique, écrite à la main après les avoir REGARDÉS
# (rendus sur un instantané de la prod du 2026-09-26, artiste 1, choix par défaut des filtres).
#
# Clé : `fichier:ligne` du site qui dessine (inventaire gold-coverage), `pdf:<clé>` pour le
# rapport artiste, `grafana:<id>` pour un panneau. Chaque entrée :
#   q        la décision à laquelle la figure répond
#   role     meta | plateforme | prediction | archi | business
#   d        DÉCISION /5 — se lit d'un coup d'œil et fait agir (Few, Information Dashboard Design)
#   c        CONFIANCE /5 — donnée établie, couche or, refuse de conclure quand elle ne suit pas
#   p        PERTINENCE /5 pour son rôle (KPI de plateforme, 4 signaux d'or SRE, dérive d'un modèle)
#   v        garder | corriger | fusionner | retirer | a-trancher
#   note     ce que j'ai vu, et le geste proposé — « à vérifier » quand je ne l'ai pas mesuré
# Garde : tests/test_the_charts_dossier_covers_every_figure.py

# ── Accueil ──────────────────────────────────────────────────────────────────
src/dashboard/utils/platform_chart.py::render_platform_chart#1:
  q: "Mes écoutes progressent-elles, toutes plateformes ?"
  decision: "Voir si une sortie ou une campagne a fait monter tes écoutes sur toutes les plateformes, pour savoir où remettre du budget."
  decision_en: "See whether a release or a campaign lifted your streams across platforms, to know where to put budget back."
  role: plateforme
  d: 3
  c: 3
  p: 5
  v: corriger
  owner_v: corriger
  owner: "Je vois les deux pointillés qui disent à quel moment on a les data, mais le deuxième pointillé, il est pas sur YouTube. Donc c'est bizarre. Et les logos Spotify et YouTube, c'est des carrés, donc ça rend pas bien. Il faut reprendre les logos comme sur SoundCloud."
  cause: arrivee-historique-lue-comme-hausse
  note: "Cumul empilé Spotify + YouTube + SoundCloud. La marche de YouTube fin 2025 (+118 k) est l'arrivée de son HISTORIQUE, pas une hausse — elle se lit comme un pic d'audience. Marquer le jour du premier relevé de chaque plateforme."
