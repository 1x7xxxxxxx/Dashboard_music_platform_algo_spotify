# R203 — la revue de chaque graphique, écrite à la main après les avoir REGARDÉS
# (rendus sur un instantané de la prod du 2026-09-26, artiste 1, choix par défaut des filtres).
#
# Clé : `fichier:ligne` du site qui dessine (inventaire gold-coverage), `pdf:<clé>` pour le
# rapport artiste, `grafana:<id>` pour un panneau. Chaque entrée :
#   q        la décision à laquelle la figure répond
#   role     meta | plateforme | prediction | archi | business
#   d        DÉCISION /5 — se lit d'un coup d'œil et fait agir (Few, Information Dashboard Design)
#   c        CONFIANCE /5 — donnée établie, couche or, refuse de conclure quand elle ne suit pas
#   p        PERTINENCE /5 pour son rôle (KPI de plateforme, 4 signaux d'or SRE, dérive d'un modèle)
#   v        garder | corriger | fusionner | retirer | a-trancher
#   note     ce que j'ai vu, et le geste proposé — « à vérifier » quand je ne l'ai pas mesuré
# Garde : tests/test_the_charts_dossier_covers_every_figure.py

