# ── Road to Algo et modèle ───────────────────────────────────────────────────
src/dashboard/views/trigger_algo/_tab_catalogue.py::_show_tab_catalogue#1:
  q: "Où chaque titre en est-il de ses portes d'algorithme ?"
  decision: "Voir quel titre est le plus proche de déclencher un algorithme, pour y concentrer ta prochaine campagne."
  decision_en: "See which track is closest to triggering an algorithm, to focus your next campaign on it."
  role: prediction
  d: 4
  c: 3
  p: 5
  v: garder
  owner_v: corriger
  owner: "Le plus simple et visuel : filtre auto sur les 5 dernières sorties, 5 indicateurs de % de trigger par algo, puis les valeurs de chaque paramètre et la cible pour 100 %."
  note: "R247 : jauges par algorithme × dernière sortie — le chemin le plus court vers la valeur où le modèle passe à 80 %, pas la probabilité (plancher de Platt). R559 (fiches 46, 56, 57) : l'encadré de chaque playlist nomme ses 3 critères les plus lourds (SHAP), le titre porte écoutes/saves/ajouts 28 j, et sous DW et Radio l'écart d'écoutes 7 j et son prix au CPR meilleur → moyen — les barres de seuils du détail par playlist sont fondues ici."
src/dashboard/views/trigger_algo/_tab_catalogue.py::_show_tab_catalogue#2:
  q: "Quelle valeur de chaque levier déclencherait l'algorithme ?"
  decision: "Savoir quelle valeur de chaque levier viser, pour fixer l'objectif de ta campagne."
  decision_en: "Know which value of each lever to aim for, to set your campaign's goal."
  role: prediction
  d: 4
  c: 3
  p: 5
  v: garder
  note: "R247 (suite de la fiche 42) : ta valeur écrite sur sa barre, et par algorithme la cible — trait vif calculé par le modèle pour ce titre, trait pâle quand ce n'est qu'un repère. R559 (fiche 47 « très moche ») : un panneau par playlist DW → Radio → RR, une barre par titre en % de SA cible (100 % = déclenche), « valeur / cible (repère) » écrit dessus, leviers triés par poids SHAP."
src/dashboard/views/trigger_algo/_tab_algo_streams.py::_show_tab_algo_streams#1:
  q: "Si un algorithme se déclenche, combien de streams rapporte-t-il — prévu et mesuré sur mon titre ?"
  decision: "Comparer ce qu'un déclenchement rapporte d'habitude à ce que ton titre a vraiment fait, pour chiffrer le budget qui vaut la peine."
  decision_en: "Compare what a trigger usually brings with what your track really did, to size the budget worth spending."
  role: prediction
  d: 4
  c: 4
  p: 5
  v: garder
  owner_v: corriger
  owner: "Fiche 129 : Release Radar en premier, ensuite Discover Weekly, ensuite Radio ; en pointillé les prédictions ; dernière release automatiquement. Fiche 48 : fusionne-la avec la 129."
  note: "R560 (fiches 129 + 48, ADR-033 §3) : UNE figure, un panneau par playlist dans l'ordre où elles agissent après une sortie (RR → DW → Radio, dérivé d'ALGO_ORDER). Médiane des titres déclenchés à 1 mois / 6 mois / 1 an en POINTILLÉ avec sa bande P25–P75 ; les saisies « 28 jours » du titre sélectionné (la dernière sortie par défaut) en POINTS PLEINS à l'âge du relevé. Fenêtre, quatre tuiles et barre empilée de la fiche 48 retirées. Fiche 49 (cycle de vie de cohorte) retirée : une cohorte d'entraînement statique ne dit pas quand couper la promo."
src/dashboard/views/trigger_algo/_tab_model.py::_show_volume_vs_recorded#1:
  q: "La prévision de volume colle-t-elle au réel ? (seules les prévisions que la porte de fiabilité autorise)"
  decision: "Vérifier si le volume prédit colle au réel, pour savoir si tu peux budgéter une campagne dessus."
  decision_en: "Check whether the predicted volume matches reality, to know if you can budget a campaign on it."
  role: prediction
  d: 3
  c: 3
  p: 5
  v: a-trancher
  owner_v: a-trancher
  owner: "Je ne comprends pas la valeur ajoutée : refais."
  cause: modele-degenere
  note: "R247 : refait — le volume prévu contre les streams d'algorithme SAISIS dans S4A (même grandeur, 28 j), par titre. Sur l'instantané : Radio prévoit 1 à 11 streams, S4A en constate 0 sur 11 titres → « le modèle surestime »."
src/dashboard/views/trigger_algo/_tab_model.py::_show_error_by_prediction_week#1:
  q: "Le modèle se rapproche-t-il du réel d'une semaine de prédiction à l'autre ?"
  decision: "Voir si le modèle s'améliore semaine après semaine, avant de lui confier une décision de campagne."
  decision_en: "See whether the model improves week after week, before trusting it with a campaign decision."
  role: prediction
  d: 3
  c: 4
  p: 4
  v: garder
  note: "R297 (R293 finie à ta demande) : regardée sur l'instantané le 2026-09-28 — Radio, 9 streams d'écart la semaine du 8 juin puis 7 chaque semaine, trou de juillet à septembre (aucune prédiction) laissé VIDE. Le modèle ne change presque pas d'avis. Un seul relevé S4A : chaque semaine jugée contre la même vérité, la légende le dit."
