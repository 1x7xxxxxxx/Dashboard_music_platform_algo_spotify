# ── Grafana — robustesse de l'app (les 4 signaux d'or, SRE p. 86) ────────────
grafana:1:
  q: "LATENCE — l'app répond-elle vite (cadre vs corps de page) ?"
  role: archi
  d: 1
  c: 1
  p: 5
  v: corriger
  owner_v: corriger
  owner: "Vérifie tous les chiffres faux ; une méthode pour avoir les bonnes valeurs dans tous les dashboards, avec des error classes — l'archi bronze/argent/or devait l'empêcher (R205)."
  cause: grafana-latence-aveugle
  note: "DEUX points mesurés en 7 jours alors que le trafic existe — le signal d'or « latence » est aveugle. Vérifier que l'histogramme de rendu est bien observé en prod (couture metrics_seam)."
grafana:2:
  q: "SATURATION — des rendus s'empilent-ils ?"
  role: archi
  d: 3
  c: 4
  p: 4
  v: garder
  note: "Toujours 0 : juste pour ce trafic ; utile le jour où il monte."
grafana:3:
  q: "SATURATION — le pool Postgres tient-il, ou retombe-t-on en connexions directes ?"
  role: archi
  d: 3
  c: 2
  p: 5
  v: corriger
  owner_v: corriger
  owner: "Vérifie tous les chiffres faux ; une méthode pour avoir les bonnes valeurs dans tous les dashboards, avec des error classes — l'archi bronze/argent/or devait l'empêcher (R205)."
  cause: pool-replis
  note: "« REPLIS directs » grimpe jusqu'à ~8 000 en dents de scie (remis à zéro à chaque déploiement) — soit le pool n'est presque jamais utilisé en prod, soit la jauge compte un cumul. La règle ConnectionPoolExhausted (direct_fallback > 0) devrait alors être en feu. À vérifier en PREMIER côté archi."
grafana:4:
  q: "ERREURS — quelles pages lèvent ?"
  role: archi
  d: 3
  c: 4
  p: 5
  v: garder
  note: "Vide sur 7 jours = zéro erreur (et le panneau 11 prouve que la lecture fonctionne). Un « 0 » écrit vaudrait mieux qu'un graphique vide."
grafana:5:
  q: "SATURATION — CPU, RAM, disque de la machine"
  role: archi
  d: 4
  c: 5
  p: 5
  v: garder
  note: "CPU ~9 %, RAM ~40 %, disque 55 → 60 % en une semaine : la pente du disque est à surveiller."
grafana:6:
  q: "TRAFIC — requêtes au proxy"
  role: archi
  d: 3
  c: 5
  p: 4
  v: garder
  note: "< 1 req/s : le signal existe et il est juste."
grafana:7:
  q: "LATENCE — quelle page est lente ?"
  role: archi
  d: 1
  c: 1
  p: 5
  v: corriger
  owner_v: corriger
  owner: "Vérifie tous les chiffres faux ; une méthode pour avoir les bonnes valeurs dans tous les dashboards, avec des error classes — l'archi bronze/argent/or devait l'empêcher (R205)."
  cause: grafana-latence-aveugle
  note: "UN seul point en 7 jours — même cécité que le panneau 1."
grafana:8:
  q: "SATURATION — mémoire des processus"
  role: archi
  d: 4
  c: 5
  p: 4
  v: garder
  note: "Le dashboard a monté à ~450 Mo le 22/09 puis est redescendu — lisible."
grafana:9:
  q: "SATURATION — CPU des processus"
  role: archi
  d: 3
  c: 5
  p: 3
  v: garder
  note: "< 2 % ; bruit de fond."
grafana:10:
  q: "ERREURS — défauts ouverts, persistants entre déploiements"
  role: archi
  d: 3
  c: 4
  p: 5
  v: garder
  note: "Vide = 0 défaut ouvert (confirmé par le panneau 11)."
grafana:11:
  q: "Le compteur de défauts sait-il lire ?"
  role: archi
  d: 4
  c: 5
  p: 4
  v: garder
  note: "Lecture réussie = 1 en continu ; âge de la dernière lecture < 45 s. Le bon garde-fou contre un « 0 » aveugle."
grafana:12:
  q: "TRAFIC — combien d'artistes et de sessions ?"
  role: business
  d: 3
  c: 4
  p: 4
  v: garder
  note: "Trois pics à 1 artiste en 7 jours — l'usage réel, et il est faible (ADR-028 : l'activation est le blocage)."
grafana:13:
  q: "TRAFIC — quelles routes d'API, quels statuts ?"
  role: archi
  d: 2
  c: 5
  p: 3
  v: garder
  note: "Surtout /metrics et /health (la supervision elle-même) ; le trafic utile est invisible dessous — filtrer ces deux routes."
grafana:14:
  q: "LATENCE — l'API répond-elle vite ?"
  role: archi
  d: 3
  c: 5
  p: 4
  v: garder
