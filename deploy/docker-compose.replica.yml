# Seconde replique du dashboard — SURCHARGE, jamais une edition de la cible
#
# Pourquoi un fichier separe (2026-09-16)
# ---------------------------------------
# Le `docker-compose.yml` de production est gitignore par construction : c'est deja la
# source de derive que l'audit de parite d'environnement existe pour attraper. L'editer
# pour monter une EXPERIENCE ferait exactement ce que le playbook de changement
# d'architecture interdit — une modification manuelle sur une cible deployee, que rien
# ne reconcilie ensuite.
#
# Une surcharge se compose et se retire :
#     docker compose -f docker-compose.yml -f deploy/docker-compose.replica.yml \
#            --profile replica up -d dashboard2
#     docker compose -f docker-compose.yml -f deploy/docker-compose.replica.yml \
#            --profile replica down dashboard2
#
# `extends` reprend l'image, l'environnement et les volumes du service d'origine : une
# seconde liste de quarante variables aurait derive des la premiere qu'on oublie. Seuls
# le nom du conteneur et le port changent. MEME image, MEME bind `./data` — les archives
# d'upload restent coherentes, c'est le meme hote.
#
# ⚠️ `extends.file` se resout depuis le REPERTOIRE DU PROJET — celui du PREMIER `-f` —
# et non depuis le fichier qui porte la directive. Ecrit `../docker-compose.yml`, il a
# cherche `/opt/docker-compose.yml` et rendu `no such file or directory`. Le chemin est
# donc relatif a la racine du depot, meme si ce fichier vit dans `deploy/`.
#
# `profiles` la tient a l'ARRET : un `docker compose up -d` ordinaire ne la leve pas,
# meme avec ce fichier present. Il faut la demander.
#
# Prealables, tous deux deployes et prouves :
#   * les seaux d'authentification comptent dans Postgres (etape 1) — sinon le budget
#     anti-force-brute vaudrait `budget x N` ;
#   * l'invalidation de cache traverse les instances (R113) — sinon celle-ci servirait
#     des chiffres perimes pendant dix minutes.
#
# Sa sonde de sante vit dans `tools/deploy.sh:service_probe()` (port 8511), et
# `tests/test_a_deploy_covers_every_service_it_starts.py` refuse qu'un amont Caddy
# existe sans elle.

services:
  dashboard2:
    extends:
      file: docker-compose.yml
      service: dashboard
    container_name: streamlytics_dashboard2
    # ⚠️ `image:` EXPLICITE, et c'est la ligne qui compte le plus de ce fichier.
    #
    # `extends` reprend aussi `build:`. Sans cette ligne, compose fabrique donc une
    # image a un nom DERIVE du service — `streamlytics-dashboard2` — distincte de celle
    # du primaire. Et `up -d` ne reconstruit pas une image qui existe deja : il sert
    # celle qui traine.
    #
    # Mesure du 2026-09-17, sur la prod : le primaire tournait sur une image du
    # 2026-09-16 a 18:51 (`python3 -m src.dashboard.serve`), la replique sur une du
    # MEME JOUR a 12:02 (`streamlit run src/dashboard/app.py`) — anterieure au commit
    # e70a83f qui a introduit `serve.py`. Sept heures et un commit d'ecart, aucun
    # avertissement. Derriere le repartiteur, la moitie des visiteurs aurait recu un
    # binaire d'un autre commit, sans exportateur de metriques : la cible Prometheus
    # sortait `connection refused` — ce qui est le SYMPTOME chanceux. Une image
    # perimee qui ecoute quand meme serait restee invisible.
    #
    # Nommer l'image du primaire rend la derive STRUCTURELLEMENT impossible : une
    # replique ne peut pas servir un autre artefact que ce qu'elle replique.
    image: streamlytics-dashboard
    profiles: ['replica']
    # `!override` et non une simple liste : `extends` FUSIONNE les listes. Sans ce tag,
    # la replique heritait `127.0.0.1:8501:8501` du service d'origine EN PLUS du 8511,
    # et Docker refusait de la demarrer — « port is already allocated ». Le symptome
    # nommait le bon port et la mauvaise cause : ce n'etait pas un conflit, c'etait un
    # heritage. (Compose >= 2.24 ; la prod est en v5.1.4.)
    ports: !override
      - '127.0.0.1:8511:8501'
