# Prometheus — ADR-026. Retention 30 j, posee sur la ligne de commande du conteneur.
#
# ⚠️ AUCUNE decouverte automatique de cibles, et c'est deliberе. Cette machine porte
# aussi les conteneurs d'un AUTRE projet (`msdr_*`), et ce depot a deja paye cette
# confusion : la sonde Docker du hook Stop est passee au VERT parce que des conteneurs
# msdr tournaient, pendant que `postgres_spotify_airflow` etait a terre. Chaque cible
# est donc nommee ici, une par une.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    product: streamlytics

# Les regles d'alerte (R115 etape 5). Prometheus les EVALUE ; il n'envoie rien —
# pas d'Alertmanager ici (ADR-026). Leur etat sort dans la serie `ALERTS`, que la tache
# `check_ops_alerts` du DAG `alert_monitor` lit a 23 h pour le mail unique du soir.
#
# Le chemin est celui du CONTENEUR. `deploy/docker-compose.observability.yml` monte
# `deploy/prometheus/rules` sur `/etc/prometheus/rules` — un montage A PART du fichier
# de config, qu'il faut ajouter en meme temps que ce bloc. Un glob qui ne matche rien
# ne fait PAS
# echouer Prometheus au demarrage — il le note et continue. Le controle qui le voit est
# `curl -s localhost:9090/api/v1/rules`, et `tests/test_the_alert_rules_are_loadable.py`
# le rejoue hors ligne.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Les DEUX repliques du dashboard, separement. Les agreger ferait disparaitre
  # l'information que R114 cherche : laquelle des deux sert, et a quel prix.
  - job_name: dashboard
    static_configs:
      - targets: ['streamlytics_dashboard:9102']
        labels: {instance_role: primary}
      - targets: ['streamlytics_dashboard2:9102']
        labels: {instance_role: replica}

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['streamlytics_api:8502']

  # Caddy tourne sur l'HOTE (service systemd), pas dans un conteneur.
  #
  # ⚠️ PAS `host.docker.internal`, et c'est MESURE : dans ce conteneur il resout vers
  # 172.17.0.1 — la passerelle du bridge PAR DEFAUT — alors que Prometheus vit sur
  # `airflow_network`, dont la passerelle est 172.18.0.1. La cible restait `down` avec
  # `connection refused`, et les 66 series `caddy_http_*` etaient exposees pour
  # personne.
  #
  # `admin` de Caddy ne prend qu'UNE adresse, et elle vaut 172.18.0.1:2019 : joignable
  # par les conteneurs de ce reseau, pas depuis Internet (adresse privee). L'API
  # d'administration peut RECONFIGURER le serveur — la lier a 0.0.0.0 serait une porte
  # ouverte, jamais un raccourci.
  #
  # L'adresse est ecrite en dur parce qu'il n'y a pas d'alternative : un conteneur ne
  # peut pas decouvrir la passerelle de son propre reseau par un nom. Si le reseau est
  # recree avec un autre sous-reseau, cette ligne et `admin` du Caddyfile changent
  # ENSEMBLE — et la cible passera `down`, ce qui est le signal.
  - job_name: caddy
    static_configs:
      - targets: ['172.18.0.1:2019']

  - job_name: node
    static_configs:
      - targets: ['streamlytics_node_exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
