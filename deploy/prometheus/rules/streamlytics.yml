# Les regles d'alerte — R115 etape 5, sous contrainte d'ADR-011.
#
# ADR-011 : « une alerte n'est envoyee que si elle nomme un SYMPTOME qu'un artiste
# pourrait observer dans le produit, ET une ACTION qu'un humain peut faire ce soir. »
# Chaque regle ci-dessous porte donc DEUX annotations obligatoires, `symptom` et
# `action`, et `tests/test_an_alert_rule_names_a_symptom_and_an_action.py` refuse d'en
# laisser passer une qui n'aurait que l'une des deux. L'ADR devient mecanique au lieu
# de rester une intention.
#
# ⚠️ CE FICHIER N'ENVOIE RIEN. Il n'y a pas d'Alertmanager ici, deliberement (ADR-026 :
# son declencheur est « plus de ~10 regles, ou un besoin d'astreinte »). Prometheus
# EVALUE ces regles toutes les 15 s et expose leur etat dans la serie `ALERTS` ; c'est
# la tache `check_ops_alerts` du DAG `alert_monitor` qui la lit a 23 h et la joint au
# mail unique du soir.
#
# La consequence a connaitre : une alerte qui part a 14 h et se resout a 15 h N'EST PLUS
# `firing` a 23 h. Le lecteur interroge donc `max_over_time(ALERTS[24h])`, pas l'etat
# instantane — sans quoi on ne verrait que les pannes qui durent encore au moment de la
# lecture, c'est-a-dire les moins interessantes.
#
# Pourquoi des regles Prometheus plutot que quatre requetes dans le DAG : « p95 > 3 s
# pendant 15 min » ne se constate PAS une fois par nuit. Une pointe de 40 minutes a
# 15 h est invisible a une requete instantanee de 23 h. Le seuil et sa duree vivent ici,
# versionnes, et Grafana les affiche a cote des courbes.

groups:
  - name: streamlytics-infra
    interval: 30s
    rules:
      # ── DISQUE ────────────────────────────────────────────────────────────
      - alert: DiskFillingUp
        expr: >-
          (1 - node_filesystem_avail_bytes{mountpoint="/"}
             / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 30m
        labels:
          severity: high
        annotations:
          symptom: >-
            Les chiffres de l'artiste cessent d'avancer. Un disque plein arrete les
            ECRITURES de Postgres et fait echouer les taches Airflow : la collecte de la
            nuit ne rentre pas, et le tableau de bord affiche la veille sans rien dire.
          action: >-
            Sur la machine — `docker system prune -af --volumes` (images et volumes
            orphelins), puis `du -xh / | sort -rh | head -20` pour nommer le vrai poste.
            `/var/log/caddy` et `/var/lib/docker/containers` sont les deux qui grossissent
            ici ; la rotation de `daemon.json` les borne a 30 Mo par conteneur depuis le
            2026-09-16, donc un depassement pointe ailleurs.
          panel: streaMLytics — sante et rendu / VPS — CPU, RAM, disque

      # ── MEMOIRE ───────────────────────────────────────────────────────────
      - alert: MemoryNearlyExhausted
        expr: node_memory_MemAvailable_bytes < 500 * 1024 * 1024
        for: 10m
        labels:
          severity: high
        annotations:
          symptom: >-
            Le tableau de bord repond 502, ou se deconnecte en pleine session. Sous ce
            seuil le tueur OOM prend un conteneur — et il prend le plus gros, qui est
            `airflow-scheduler` (1,9 Go) ou le dashboard lui-meme.
          action: >-
            `docker stats --no-stream` pour voir qui a grossi. Les deux leviers
            reversibles ce soir, dans cet ordre : arreter le profil d'observabilite
            (`docker compose --profile observability down`, ~500 Mo) puis la replique
            `streamlytics_dashboard2` si elle tourne. Aucun des deux ne coupe le produit.
          panel: streaMLytics — sante et rendu / VPS — CPU, RAM, disque

  - name: streamlytics-app
    interval: 30s
    rules:
      # ── LATENCE DE RENDU ──────────────────────────────────────────────────
      - alert: RenderLatencyDegraded
        expr: >-
          histogram_quantile(0.95, sum by (le)
            (rate(streamlytics_rerun_duration_seconds_bucket[5m]))) > 3
        for: 15m
        labels:
          severity: medium
        annotations:
          symptom: >-
            Un artiste sur vingt attend plus de trois secondes a chaque clic, pendant au
            moins un quart d'heure. C'est le symptome le plus directement observable de
            tous : il N'EST QUE l'experience de l'utilisateur, sans intermediaire.
          action: >-
            Regarder d'abord `streamlytics_rerun_duration_seconds{phase}` : `chrome`
            (barre laterale, navigation, authentification) et `view` se reparent a des
            endroits differents. ⚠️ Une premiere redaction annoncait ici « un rapport
            mesure d'environ 8x » entre les deux : c'est REFUTE, et dans le mauvais sens.
            La mesure du 2026-09-16 rend `chrome` plate a 11-13 ms contre `view` de
            49,8 ms (`saisie_s4a`) a 776,8 ms (`meta_mapping`) — c'est la VUE qui domine,
            de tres loin. Commencer donc par `phase="view"`, page par page : la page est
            dans le label. Si `chrome` domine, c'est la barre laterale, et le levier de ce
            soir est de demarrer la replique (voir l'en-tete de `deploy/Caddyfile`, deux
            gestes). Redemarrer le dashboard ne rend la main que si la cause est une
            fuite, ce que la courbe dit : une degradation en marche d'escalier, pas une
            pente.
          honesty: >-
            ⚠️ C'est la regle la plus faible des quatre au regard d'ADR-011, et il faut
            le dire : « actionnable ce soir » y signifie diagnostiquer et appliquer un
            palliatif reversible, pas corriger. Le correctif est un chantier (R118/R120/
            R121). Elle est envoyee quand meme parce que le symptome, lui, est deja chez
            l'artiste — et qu'une lenteur non mesuree est precisement ce que le premier
            parcours artiste n'a PAS su nommer : ~20 remarques, aucune sur la lenteur.
          panel: streaMLytics — sante et rendu / Latence de rendu — CHROME vs VUE (p95)

      # ── POOL DE CONNEXIONS ────────────────────────────────────────────────
      - alert: ConnectionPoolExhausted
        expr: streamlytics_postgres_pool_connections{state="direct_fallback"} > 0
        for: 5m
        labels:
          severity: high
        annotations:
          symptom: >-
            Des pages rendent une erreur de connexion, de facon intermittente et sans
            motif lisible pour l'artiste — deux clics identiques, l'un passe, l'autre
            non.
          action: >-
            Ce compteur n'est pas un ratio : il compte les fois ou le pool etait VIDE et
            ou le code a ouvert une connexion directe pour ne pas echouer. Une seule
            suffit a signaler. Comparer
            `streamlytics_postgres_pool_connections{state="borrowed"}` a la taille du
            pool — `maxconn=8`, la valeur que passent les DEUX appelants reels
            (`src/dashboard/utils/__init__.py` et `src/api/main.py`). Le `maxconn=10` de
            `postgres_handler.py:92` est la valeur par DEFAUT de la signature, que
            personne n'utilise : la comparer a `borrowed` donnerait un mauvais plafond.
            colle au plafond => monter `maxconn` ; loin du plafond => une connexion fuit,
            et c'est une vue qui ne passe pas par `view_session()`.
          panel: streaMLytics — sante et rendu / Pool Postgres — et le repli SILENCIEUX

  # ══════════════════════════════════════════════════════════════════════════════
  # Les instruments muets — groupe ajouté le 2026-09-17
  #
  # Les quatre règles ci-dessus surveillent le SERVICE. Aucune ne surveillait
  # l'INSTRUMENT, et c'est le trou que ce groupe ferme. Mesure du 2026-09-17 :
  # `RenderLatencyDegraded` ne peut ni se déclencher ni signaler qu'elle est aveugle,
  # parce que `histogram_quantile` d'un histogramme vide rend `NaN` et qu'une
  # comparaison avec NaN est fausse. Une alerte `inactive` se lit « tout va bien »
  # alors qu'elle veut dire « je ne mesure rien ».
  #
  # ⚠️ Aucune des quatre ne porte de seuil, et c'est délibéré. Le dépôt tient qu'un
  # seuil écrit d'instinct est un défaut, et le trafic actuel ne permet d'en dériver
  # aucun. Les seuils de CHARGE — sessions, taux d'erreur, pointe de journaux — sont
  # différés avec leur commande de calibration, dans la roadmap. Ici tout est binaire :
  # l'instrument parle, ou il ne parle pas.
  #
  # Total après ce groupe : 8 règles. Le déclencheur d'adoption d'Alertmanager écrit
  # dans ADR-026 est à ~10 — on reste dessous, mais la marge se referme.
  - name: streamlytics-instruments
    interval: 30s
    rules:
      - alert: MetricsExporterSilent
        expr: absent(streamlytics_reruns_in_flight)
        for: 10m
        labels:
          severity: high
        annotations:
          symptom: >-
            Le dashboard n'expose plus aucune métrique de rendu. Les panneaux « Latence
            de rendu » et « File d'attente » sont vides, et les alertes qui en dépendent
            (`RenderLatencyDegraded`) sont INACTIVES parce qu'elles ne mesurent rien —
            pas parce que tout va bien.
          action: >-
            Vérifier que le conteneur tourne avec `python3 -m src.dashboard.serve` et non
            `streamlit run` : seul `serve.py` démarre l'exportateur AVANT Streamlit. Puis
            `docker exec streamlytics_dashboard python3 -c "import urllib.request as u;
            print(u.urlopen('http://localhost:9102/metrics').read()[:200])"`. Une sortie
            vide signifie que l'exportateur n'a pas démarré ; les logs du conteneur
            portent alors « exportateur de métriques non démarré ».
          panel: streaMLytics — sante et rendu / File d'attente — rendus en cours

      - alert: ApiExportsNothing
        expr: absent(streamlytics_http_requests_total)
        for: 15m
        labels:
          severity: medium
        annotations:
          symptom: >-
            L'API est scrutée mais n'expose aucune métrique de requête. Sa cible est `up`
            en mesurant zéro — un service entier invisible, dont la cible verte se lit
            comme une couverture. C'est l'état mesuré le 2026-09-17, avant l'ajout du
            middleware.
          action: >-
            `curl -s http://127.0.0.1:8502/metrics | grep -c "^streamlytics_http_"` doit
            rendre un nombre non nul. S'il rend 0, vérifier que `install_http_metrics(app)`
            est bien appelé dans `src/api/main.py` — gardé par
            `tests/test_the_api_measures_itself_without_unbounded_labels.py`.
          panel: streaMLytics — sante et rendu / Processus — RAM residente

      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: high
        annotations:
          symptom: >-
            Une cible de scrutation ne répond plus. Tout ce qu'elle mesurait a cessé
            d'exister SANS qu'aucune autre alerte ne se déclenche : les règles portant sur
            ses métriques deviennent silencieuses, pas rouges.
          action: >-
            `curl -s "http://127.0.0.1:9090/api/v1/targets?state=active" | python3 -m
            json.tool` nomme la cible et l'erreur exacte. Un `connection refused` sur le
            dashboard ou l'API signifie que le conteneur est tombé ou qu'il tourne avec le
            mauvais point d'entrée ; sur `caddy`, que l'admin API de Caddy n'écoute plus
            sur 2019.
          panel: streaMLytics — sante et rendu

      - alert: DefectGaugeBlind
        expr: >-
          (streamlytics_open_defects_read_ok == 0)
          or absent(streamlytics_open_defects_read_ok)
        for: 15m
        labels:
          severity: medium
        annotations:
          symptom: >-
            La jauge des défauts ouverts ne peut plus lire `app_error_log`. Le panneau
            « Défauts ouverts » n'affiche AUCUNE série — ce qui est volontaire : il vaut
            mieux un panneau vide qu'un « 0 défaut » inventé pendant une panne de base.
          action: >-
            Le second terme (`absent`) signifie que le processus dashboard est mort ou que
            la jauge n'a pas été installée ; le premier, que la base ne répond pas à une
            requête bornée à 2 s. Vérifier Postgres d'abord (`docker exec
            postgres_spotify_airflow pg_isready`), puis les logs du dashboard, qui portent
            « défauts ouverts illisibles ».
          panel: streaMLytics — sante et rendu / Defauts ouverts par page
