# ============================================================================
# TEMPLATE — copiez ce fichier en `docker-compose.yml` (gitignored, local par env).
# Tous les secrets sont des références `${VAR}` résolues depuis le `.env` / shell —
# AUCUN secret en clair ici (cf. `.env.example`). Postgres + Airflow sont bindés sur
# 127.0.0.1 (jamais exposés sur Internet — voir deployment.md § D0).
#   cp docker-compose.example.yml docker-compose.yml
# Le vrai `docker-compose.yml` reste gitignored ; ce template versionné porte le
# durcissement sécurité (miroir de `.env.example` / `config/config.example.yaml`).
# ============================================================================
services:
  # ============================================================================
  # POSTGRESQL - Base de données unique
  # ============================================================================
  postgres:
    image: postgres:17
    container_name: postgres_spotify_airflow
    restart: unless-stopped          # survive host reboot (other services depend on it)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: airflow_db
      TZ: Europe/Paris  # ✅ CONFIGURATION HEURE PARIS
    ports:
      # Loopback-only: the DB must never be world-reachable on a public VPS. Local dev
      # (dashboard at localhost:5433, make migrate via docker exec) is unaffected.
      # Inter-container traffic uses the `postgres:5432` service name, not this mapping.
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow_network

  # ============================================================================
  # AIRFLOW INIT - Initialisation
  # ============================================================================
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${DATABASE_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      # Reparsing des DAGs : 30 s (le defaut) -> 300 s. Mesure le 2026-09-04 :
      # scheduler a 28,9 % de CPU en continu pour 16 DAGs, contre 0,33 % au
      # webserver — le brassage est du cote parsing, pas de l affichage.
      #
      # Le prix : un DAG nouveau ou modifie met jusqu a 5 min a apparaitre au lieu
      # de 30 s. Sur un depot ou les DAGs bougent quelques fois par mois, c est le
      # bon echange ; sur un depot ou on itere sur un DAG toute la journee, ca ne le
      # serait pas. `airflow dags reserialize` force la relecture quand on est presse.
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '300'
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      PYTHONPATH: /opt/airflow
      TZ: Europe/Paris  # ✅ CONFIGURATION HEURE PARIS (S'applique à tous les services Airflow)
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

      # Database pour les DAGs (spotify_etl)
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: spotify_etl
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      FERNET_KEY: ${FERNET_KEY}

      # Alerting — the DAGs' failure callbacks, freshness alerts and the daily
      # consolidated mail all go through src/utils/email_alerts.py. Absent here
      # until 2026-08-20: the scheduler could not send ANY alert, so 672 CSV-watcher
      # failures over a week went unreported. `.env` had the values; this block did
      # not pass them on. Error class `env-not-wired-to-service`.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_EMAIL: ${ALERT_EMAIL}
      # Absolute links in the mails the SCHEDULER sends — onboarding_report imports
      # verification_email._unsubscribe_footer. Absent here until 2026-08-23, so the
      # one-click unsubscribe link in every onboarding report pointed at
      # http://localhost:8501, the module-level default. Same class as the SMTP block
      # above: `.env` had the value, this block did not pass it on.
      APP_BASE_URL: ${APP_BASE_URL}
      STREAMLYTICS_ENV: ${STREAMLYTICS_ENV:-local}
      # Écrire à un CLIENT est une décision. Sans cette variable, `send_email`
      # refuse — et depuis le 2026-09-03 le récap hebdomadaire premium en
      # dépend, donc `check_env_parity` l'exige sur le scheduler.
      STREAMLYTICS_ALLOW_ARTIST_EMAIL: ${STREAMLYTICS_ALLOW_ARTIST_EMAIL:-0}
      AIRFLOW_UI_URL: ${AIRFLOW_UI_URL:-http://localhost:8080}

      # Spotify API
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      # No default: this is the ADMIN's own artist id, not a fallback identity
      # for tenants (see LEGACY_SINGLE_TENANT).
      SPOTIFY_ARTIST_IDS: ${SPOTIFY_ARTIST_IDS:-}

      # Meta Ads
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      # No default — same reason as SPOTIFY_ARTIST_IDS above.
      META_AD_ACCOUNT_ID: ${META_AD_ACCOUNT_ID:-}
      META_API_VERSION: v21.0

      # YouTube API
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID}

      # SoundCloud — shared admin app (one app serves all artists; artist supplies
      # only their user_id). Without these the soundcloud_daily collector + precheck
      # report "app non configurée" and never collect.
      SOUNDCLOUD_CLIENT_ID: ${SOUNDCLOUD_CLIENT_ID}
      SOUNDCLOUD_CLIENT_SECRET: ${SOUNDCLOUD_CLIENT_SECRET}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      # tools/ too: the operational scripts (create_canary, artist_preflight,
      # tenant_contamination_check) need psycopg2, which lives in the containers
      # and NOT on the host. Without this mount the documented production
      # procedure cannot run at all — measured 2026-08-21 on the live server:
      # "can't open file '/app/tools/create_canary.py'". Read-only: these
      # scripts are read, never written, from inside a container.
      - ./tools:/opt/airflow/tools:ro
      - ./data:/opt/airflow/data
      - ./.env:/opt/airflow/.env
      - ./machine_learning:/opt/airflow/machine_learning:ro
    command: version
    networks:
      - airflow_network

  # ============================================================================
  # AIRFLOW WEBSERVER
  # ============================================================================
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
    ports:
      # Loopback-only: Airflow = arbitrary code execution by design; never expose it
      # directly on a public VPS. Reach the UI via SSH tunnel or an authenticated
      # reverse proxy. Local dev at localhost:8080 is unaffected.
      - '127.0.0.1:8080:8080'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      # tools/ too: the operational scripts (create_canary, artist_preflight,
      # tenant_contamination_check) need psycopg2, which lives in the containers
      # and NOT on the host. Without this mount the documented production
      # procedure cannot run at all — measured 2026-08-21 on the live server:
      # "can't open file '/app/tools/create_canary.py'". Read-only: these
      # scripts are read, never written, from inside a container.
      - ./tools:/opt/airflow/tools:ro
      - ./data:/opt/airflow/data
      - ./.env:/opt/airflow/.env
      - ./machine_learning:/opt/airflow/machine_learning:ro
    command: bash -c "rm -f /opt/airflow/airflow-webserver.pid && airflow webserver"
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - airflow_network

  # ============================================================================
  # AIRFLOW SCHEDULER
  # ============================================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      # tools/ too: the operational scripts (create_canary, artist_preflight,
      # tenant_contamination_check) need psycopg2, which lives in the containers
      # and NOT on the host. Without this mount the documented production
      # procedure cannot run at all — measured 2026-08-21 on the live server:
      # "can't open file '/app/tools/create_canary.py'". Read-only: these
      # scripts are read, never written, from inside a container.
      - ./tools:/opt/airflow/tools:ro
      - ./data:/opt/airflow/data
      - ./.env:/opt/airflow/.env
      - ./machine_learning:/opt/airflow/machine_learning:ro
    command: scheduler
    restart: unless-stopped
    networks:
      - airflow_network

  # ============================================================================
  # STREAMLIT DASHBOARD (containerised for prod — runs on the host in local dev)
  # ============================================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamlytics_dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Prod DB path = DATABASE_URL (get_db_connection priority #1; config.yaml is the
      # local-dev fallback). Inter-container host = the `postgres` service name.
      DATABASE_URL: postgresql://postgres:${DATABASE_PASSWORD}@postgres:5432/spotify_etl
      FERNET_KEY: ${FERNET_KEY}                       # decrypt stored API credentials
      APP_BASE_URL: ${APP_BASE_URL}                   # absolute links in verification emails
      STREAMLYTICS_ENV: ${STREAMLYTICS_ENV:-local}    # `production` ⇒ pas de préfixe [LOCAL] sur les mails
      AIRFLOW_UI_URL: ${AIRFLOW_UI_URL:-http://localhost:8080}   # lien CLIQUABLE ≠ AIRFLOW_BASE_URL (DNS interne)
      # "Lancer TOUTES les collectes" sidebar button triggers DAGs via the Airflow API
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      AIRFLOW_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      # Central-app credentials — REQUIRED by the Credentials page: the connection
      # tests + app_level_configured() run IN this container and fall back to these
      # env vars when an artist leaves a field blank (the admin owns one app per
      # platform). Without them, EVERY connection test fails ("contacter admin" /
      # "clé non valide") even though the collectors (airflow containers) have them.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID}
      SOUNDCLOUD_CLIENT_ID: ${SOUNDCLOUD_CLIENT_ID}
      SOUNDCLOUD_CLIENT_SECRET: ${SOUNDCLOUD_CLIENT_SECRET}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      # Email (verification / alerts / digest). With a relay like Brevo, SMTP_USER is
      # the relay login and SMTP_FROM is the authenticated sender (noreply@<domain>).
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-}
      # Destination of admin alerts — email_alerts.py reads it here too.
      ALERT_EMAIL: ${ALERT_EMAIL}
      # Billing page reads these (Stripe checkout/portal links)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_CHECKOUT_URL: ${STRIPE_CHECKOUT_URL}
      STRIPE_PORTAL_URL: ${STRIPE_PORTAL_URL}
      TZ: Europe/Paris
    ports:
      # Loopback-only: Caddy (app.<domain>) terminates TLS and proxies to this.
      - '127.0.0.1:8501:8501'
    volumes:
      # ML artifacts (.ubj models + mlruns) are NOT baked into the image — mount them.
      - ./machine_learning:/app/machine_learning:ro
      - ./data:/app/data
      # Onboarding guide PDF (welcome-email attachment) — also not baked into the image.
      - ./docs:/app/docs:ro
    restart: unless-stopped
    networks:
      - airflow_network

  # ============================================================================
  # FASTAPI BACKEND (hosts the Stripe webhook — api.<domain>)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: streamlytics_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8502                                      # match Caddy api.<domain> upstream
      DATABASE_URL: postgresql://postgres:${DATABASE_PASSWORD}@postgres:5432/spotify_etl
      API_SECRET_KEY: ${API_SECRET_KEY}               # JWT signing (no ephemeral fallback in prod)
      API_STRICT_BOOT: '1'                            # fail loud at boot on weak/absent API_SECRET_KEY / DATABASE_URL
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_ENABLE_DOCS: ${API_ENABLE_DOCS:-}           # leave empty in prod (/docs + /redoc off)
      # Brute-force / rate-limit posture (src/api/security.py). Without these the code
      # falls back to in-file defaults — wire them so prod limits are explicit + tunable.
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-120}
      API_RATE_LIMIT_WINDOW_SECS: ${API_RATE_LIMIT_WINDOW_SECS:-60}
      API_AUTH_RATE_LIMIT_MAX: ${API_AUTH_RATE_LIMIT_MAX:-10}
      API_AUTH_RATE_LIMIT_WINDOW_SECS: ${API_AUTH_RATE_LIMIT_WINDOW_SECS:-300}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET} # webhook returns 503 if unset (intended)
      TZ: Europe/Paris
    ports:
      - '127.0.0.1:8502:8502'
    restart: unless-stopped
    networks:
      - airflow_network

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
  airflow_logs:

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  airflow_network:
    driver: bridge
