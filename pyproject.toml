[project]
name = "streamlytics"
version = "0.1.0"
description = "streaMLytics — multi-tenant music analytics SaaS (ELT pipeline + Streamlit dashboard)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Data & processing
    "pandas==2.3.3",
    "numpy==1.26.4",
    "psutil>=5.9.0",
    "xgboost>=2.0.0",
    # scikit-learn is an implicit runtime dependency of xgboost 2.x:
    # XGBClassifier.predict_proba() and XGBRegressor.predict() fail at call
    # time with `sklearn needs to be installed` if it's missing. Discovered
    # 2026-05-14 when ml_scoring_daily was found silently broken in the
    # Airflow image (xgboost present, sklearn absent). Pin >=1.3 — xgboost 2
    # uses the modern estimator API.
    "scikit-learn>=1.3.0",
    "shap>=0.44.0",
    "lime>=0.2.0",

    # API clients
    "facebook-business==18.0.5",
    "spotipy==2.26.0",
    "google-api-python-client==2.199.0",

    # Dashboard (Streamlit + plotly + PDF rendering)
    "streamlit==1.62.0",
    "plotly==5.24.1",
    "watchdog==3.0.0",
    "weasyprint>=62.0",
    "openpyxl",                 # meta_insight xlsx watcher

    # Utilities
    "python-dateutil>=2.8.2",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "python-dotenv==1.2.3",
    "cryptography>=42.0.0",
    "isodate==0.7.2",

    # REST API (Brick 14)
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # bcrypt 4.1+ rejects passwords >72 bytes with ValueError, breaking
    # passlib 1.7.4's detect_wrap_bug probe (73-byte secret). Without this
    # pin, the entire bcrypt backend fails to load and login tests crash.
    # Re-evaluate when passlib >1.7.4 ships (project dormant since 2020).
    "bcrypt>=4.0,<5.1",
    "python-multipart>=0.0.9",

    # Stripe billing (Brick 21)
    "stripe>=8.0.0",

    # TOTP 2FA (Brick 28)
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",

    # Database driver
    "psycopg2-binary==2.9.12",

    # Airflow. The CORE is pinned to the version production runs, and that is not
    # cosmetic: the providers below carry no version, so the resolver is free to
    # bring a core along with them — and it did. Measured 2026-08-30, uv.lock held
    # apache-airflow 3.2.2 while production ran 2.11.2, so every DAG-shaped test in
    # the suite validated the DAGs against an Airflow the scheduler never loads,
    # and reported green. Dependabot PR #100 (3.3.0) would have broken the import of
    # all 16 DAGs; only the image's own --constraint stood in the way, at build time,
    # after the suite had already passed.
    #
    # Keep this in step with ARG AIRFLOW_VERSION in Dockerfile.airflow — the two are
    # compared by tests/test_the_tests_run_the_airflow_production_runs.py.
    "apache-airflow==2.11.2",
    "apache-airflow-providers-postgres",
    "apache-airflow-providers-http",
    "apache-airflow-providers-common-sql",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    # Exécution parallèle de la suite. Mesuré le 2026-08-17 sur cette machine,
    # contre un Postgres provisionné comme celui de la CI (init_db.sql + les
    # migrations, 91 tables) pour que les tests base tournent VRAIMENT :
    # 147,2 s en série → 101,1 s à `-n 4 --dist loadfile`, avec 655 passés et
    # 14 sautés des deux côtés. Une première mesure sans DATABASE_URL ne
    # prouvait rien — 67 tests sautaient, dont tous ceux qui écrivent en base,
    # c'est-à-dire exactement ceux qui pourraient entrer en collision.
    # `--dist loadfile` garde les tests d'un même fichier sur un même worker :
    # `tests/test_live_pulse.py` est le seul à écrire une table réelle
    # (`active_sessions`), il ne peut donc pas se courir après lui-même.
    "pytest-xdist>=3.5.0",
    "httpx>=0.27.0",
    "ruff==0.16.5",
    # Pre-commit framework + secret scanner (.pre-commit-config.yaml)
    "pre-commit>=4.6.0",
    "detect-secrets>=1.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Existing ruff config lives in ruff.toml — keep it authoritative.
extend = "ruff.toml"

[tool.pytest.ini_options]
# Le seul marqueur du dépôt, et il est délibérément unique.
#
# `real_http` est l'unique sortie de la frontière HTTP de `tests/conftest.py`. Déclaré
# ici pour que `--strict-markers` (ou une faute de frappe) ne le laisse pas passer en
# silence : un marqueur mal orthographié ne sort pas de la frontière, il la subit — et
# le test échoue avec un message qui parle d'autre chose.
markers = [
    "real_http: le test sort VRAIMENT sur le réseau (sonde de production). Seule sortie de la frontière HTTP de tests/conftest.py ; sa portée est gardée par tests/test_the_http_escape_hatch_stays_narrow.py",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/api/main.py",          # FastAPI entry — exercised by integration tests we don't run in CI yet
    "*/__pycache__/*",
    "*/migrations/*",
    "*/tests/*",
]
branch = true

[tool.coverage.report]
# No fail_under threshold yet — we're measuring first, gating later (avoids
# arbitrary number-chasing before there's a baseline).
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
