# gitleaks — configuration du dépôt (2026-09-25, R167).
#
# Sans ce fichier, `gitleaks detect` (security-nightly.yml) était rouge 5 nuits sur 5 sur
# 38 trouvailles, sous un workflow vert que personne ne lisait. Tri (security-specialist,
# valeurs jamais affichées) : 26 faux positifs, 12 VRAIS secrets dans l'historique public.
# Ce fichier et `.gitleaksignore` n'écartent QUE les 26 ; les 12 restent rouges tant
# qu'ils ne sont pas tournés (runbook §27) — leur empreinte n'entre dans `.gitleaksignore`
# qu'APRÈS rotation.
title = "streamlytics"

[extend]
useDefault = true

# ⚠️ `[allowlist]` (une seule table) et NON `[[allowlists]]` : l'action de CI embarque
# gitleaks 8.24.3, qui ignore la forme plurielle (8.25+). Mesuré le 2026-09-25 : la forme
# plurielle rendait 12 en local (8.28) et 24 en CI (8.24.3). Chemin OU regex : l'un suffit.
[allowlist]
description = "baseline detect-secrets (hachés SHA-1) ; clés de widget Streamlit ; admin:admin cité comme anti-exemple"
paths = ['''^\.secrets\.baseline$''']
regexTarget = "line"
regexes = [
  '''\bkey\s*=\s*["'][a-z0-9]+(?:_[a-z0-9]+)+["']''',
  '''curl -u admin:admin''',
]
